<!doctype html>
<html><head><meta charset="utf-8"><title>Penrose kite and dart shells</title>
<style>html,body{margin:0;height:100%;background:#efe3c8;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
const cv=document.getElementById('c'),x=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const P=(1+Math.sqrt(5))/2;
const r=(a,l)=>[l*Math.cos(a),l*Math.sin(a)];
const ad=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];
// seed kite = two mirrored half-kites, axis pointing up
const D=Math.PI/180,U=-90*D;
let T=[[0,[0,0],r(U-36*D,1),r(U,1)],[0,[0,0],r(U+36*D,1),r(U,1)]];
const G=[T];
for(let g=0;g<7;g++){const n=[];for(const[c,A,B,C]of T){
if(c==0){const Q=ad(A,B,1/P),R=ad(B,C,1/P);n.push([1,R,Q,B],[0,Q,A,R],[0,C,A,R]);}
else{const Q=ad(C,A,1/P);n.push([1,B,Q,A],[0,Q,C,B]);}}T=n;G.push(T);}
const CX=0,CY=-0.55;
const cnt=G.map(t=>{let k=0,d=0;for(const q of t)q[0]?d++:k++;return[k/2,d/2]});
for(const t of G)for(const q of t){const m=(q[1][0]+q[2][0]+q[3][0])/3-CX,n=(q[1][1]+q[2][1]+q[3][1])/3-CY;q.push(Math.hypot(m,n));}
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5),16)];
const CR=hx('#efe3c8'),OC=hx('#c8912e'),RU=hx('#9c4a24'),AM=hx('#e6b45c'),GR='#3a332c';
const mix=(a,b,k)=>`rgb(${a.map((v,i)=>v+(b[i]-v)*k|0)})`;
const ss=e=>e<0?0:e>1?1:e*e*(3-2*e);
// generation schedule (story seconds); held windows around 2 s and 8 s
const S=[0,0.9,3.8,5.2,6.2,9.7,11.2,12.8];
const genAt=t=>{let g=0;for(let i=0;i<S.length;i++)if(t>=S[i])g=i;return g};
let W,H;const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener('resize',rs);
function tiles(g,a,t,sc){const tr=G[g],ag=t;
x.globalAlpha=a;x.lineJoin='round';x.lineWidth=Math.max(0.6,2.2-g*0.25);x.strokeStyle=GR;
for(const q of tr){const d=q[4];
// shell age: inner shells older (pale), outer shell newest (saturated)
const ring=Math.min(1,d/0.62),f=ss((ring-0.35)*1.6+0.05*g-0.2);
const old=g<2?0:1-f;
x.fillStyle=q[0]?mix(RU,AM,old*0.75*ss((t-5)/4)):mix(OC,CR,old*0.7*ss((t-5)/4));
x.beginPath();x.moveTo(q[1][0],q[1][1]);x.lineTo(q[2][0],q[2][1]);x.lineTo(q[3][0],q[3][1]);x.closePath();x.fill();}
x.lineWidth/=sc;
for(const q of tr){x.beginPath();x.moveTo(q[2][0],q[2][1]);x.lineTo(q[1][0],q[1][1]);x.lineTo(q[3][0],q[3][1]);x.stroke();}
x.globalAlpha=1;}
const t0=performance.now();
function fr(){const t=(performance.now()-t0)/1000*(RM?0.2:1);
x.fillStyle='#efe3c8';x.fillRect(0,0,W,H);
const g=genAt(t),pa=ss((t-S[g])/0.55);
// camera: grow, push in 10-15 s on outer shell, pull back 15-20 s
let z=H*(0.62+0.5*ss((t-4)/5)),ox=0,oy=0;
const pin=ss((t-10)/2.5)-ss((t-15)/4);z*=1+1.6*pin;ox=0.28*pin;oy=-0.3*pin;
z*=1-0.12*ss((t-15)/4);
const rot=Math.sin(t*0.11)*0.05+(RM?0:0.004*Math.max(0,t-20));
x.save();x.translate(W/2,H/2);x.rotate(rot);x.scale(z,z);x.translate(-CX-ox,-CY-oy);
x.lineWidth=1;
if(pa<1&&g>0)tiles(g-1,1,t,z);
tiles(g,pa,t,z);
x.restore();
// count bars, driven by the generated patch
const c0=g>0?cnt[g-1]:cnt[0],c1=cnt[g],k=c0[0]+(c1[0]-c0[0])*pa,d=c0[1]+(c1[1]-c0[1])*pa,tot=k+d;
x.fillStyle='rgba(239,227,200,0.9)';x.fillRect(16,16,270,104);
x.strokeStyle=GR;x.lineWidth=1.5;x.strokeRect(16,16,270,104);
x.fillStyle='#c8912e';x.fillRect(28,34,200*k/tot,22);
x.fillStyle='#9c4a24';x.fillRect(28,66,200*d/tot,22);
x.fillStyle=GR;x.font='13px ui-monospace,Menlo,monospace';
x.fillText('kites '+c1[0],28,30+0);x.fillText('darts '+c1[1],28,62+0);
x.fillText('gen '+g+'  K:D '+(c1[1]?(c1[0]/c1[1]).toFixed(3):'-'),28,108);
requestAnimationFrame(fr);}
requestAnimationFrame(fr);
</script></body></html>
