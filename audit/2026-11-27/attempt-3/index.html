// ---- palette (brief) ----

const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k|0);

const cl=x=>x<0?0:x>1?1:x, sm=x=>(x=cl(x),x*x*(3-2*x));

// ---- stochastic L-system: X -> one of three productions, chosen by seeded rng ----
const R=srng(20261127);
const P=['F[+X]F[-X]X','F[-X][+X]FX','FF[+X][-X]','F[+X]FX'];
let s='X';
for(let g=0;g<7;g++){let o='';for(const ch of s){if(ch==='X'){const r=R();o+=P[r<.36?0:r<.7?1:r<.88?2:3]}else o+=ch}s=o}

{let x=0,y=0,a=-Math.PI/2+.35,d=0;const st=[];
for(const ch of s){
 if(ch==='F'){const L=.05*(.75+.5*R()),nx=x+Math.cos(a)*L,ny=y+Math.sin(a)*L;segs.push([x,y,nx,ny,d]);x=nx;y=ny;d++}
 else if(ch==='+')a+=.42+.2*(R()-.5);
 else if(ch==='-')a-=.42+.2*(R()-.5);
 else if(ch==='[')st.push([x,y,a,d]);
 else if(ch===']')[x,y,a,d]=st.pop();
 else if(ch==='X'&&R()<.82)tips.push([x,y,d]);

}
// normalise, then mirror

for(const q of segs){for(const m of[1,-1])SG.push([q[0]*sc*m,q[1]*sc-oy,q[2]*sc*m,q[3]*sc-oy,q[4]]);maxd=Math.max(maxd,q[4])}
for(const p of tips)for(const m of[1,-1])N.push({x:p[0]*sc*m,y:p[1]*sc-oy,d:p[2]+R()*1.5,dim:0,n:0,m});

let T=0,last=-1;
