<style>*{margin:0}html,body{background:#6e5a3c;overflow:hidden}canvas{width:100vw;height:100vh;display:block}#t{position:fixed;left:14px;bottom:10px;font:12px ui-monospace,Menlo,monospace;color:#f2c9a0;letter-spacing:.12em;pointer-events:none}</style>

<body>
<canvas id="c"></canvas>
<div id="t">FOUR-GRAIN TOPPLING FRONTS</div>
<script type="module">
const GL_HEAD=`#version 300 es
precision highp float;precision highp int;precision highp sampler2D;
uniform float u_time,u_reduced;uniform vec2 u_res,u_mouse;uniform vec4 u_audio;out vec4 o;

// Abelian four-grain toppling on a 256 x 256 integer grid.
// Heights live in R (h / 32, exact in half float and in RGBA8); G = topple flash, B = umber scar memory.
const N = 256, SPS = 24, DS = 12, CAP = 8, C = [128, 128];

// Seeded integer hash (JS side) for drop cells.
const hash = i => { let x = Math.imul(i ^ 0x9e3779b9, 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16; return (x >>> 0) / 4294967296; };
const DR = [];
for (let k = 0; k < 64; k++) DR.push([128 + Math.round((hash(2 * k + 1) - 0.5) * 80), 128 + Math.round((hash(2 * k + 2) - 0.5) * 80)]);

// Story-time drop schedule: one centre drop at 1 s; seeded cells every 0.5 s in beats 2 and 3;
// a centre drop at 19 s; then one seeded drop per second after 20 s so the field keeps moving.
const dropAt = s => {
  if (s % DS) return null;
  const k = (s / DS) | 0;
  if (s === SPS) return C;
  if (s < 5 * SPS) return null;
  if (s < 15 * SPS) return DR[k % 64];
  if (s === 19 * SPS) return C;
  if (s < 20 * SPS) return null;
  return s % SPS ? null : DR[k % 64];
};

const SIM = GL_HEAD + `uniform sampler2D S;uniform float Z,A;uniform vec2 D;
uint hu(uint x){x^=x>>16u;x*=0x7feb352du;x^=x>>15u;x*=0x846ca68bu;x^=x>>16u;return x;}
float hh(ivec2 q){if(q.x<0||q.y<0||q.x>255||q.y>255)return 0.;return floor(texelFetch(S,q,0).r*32.+.5);}
float tt(ivec2 q){return step(4.,hh(q));}
void main(){
 ivec2 p=ivec2(gl_FragCoord.xy);
 if(Z>.5){
  float h=1.+float(hu(uint(p.x)*73856093u^uint(p.y)*19349663u^2026u)%3u);
  if(p==ivec2(128,128))h=3.;
  o=vec4(h/32.,0.,0.,1.);return;
 }
 vec4 v=texelFetch(S,p,0);
 float h=floor(v.r*32.+.5);
 float t=tt(p);
 h+=tt(p+ivec2(1,0))+tt(p+ivec2(-1,0))+tt(p+ivec2(0,1))+tt(p+ivec2(0,-1))-4.*t;
 if(A>.5&&p==ivec2(D))h+=1.;
 float g=t>.5?1.:v.g*.92;
 float b=min(1.,v.b*.996+t*.35);
 o=vec4(h/32.,g,b,1.);
}`;

const RENDER = `uniform sampler2D S;uniform float HS;
void main(){
 vec2 p=(2.*gl_FragCoord.xy-u_res)/u_res.y;
 vec2 c=vec2(128.)+p*HS;
 ivec2 q=ivec2(floor(c));
 vec3 A=vec3(242.,201.,160.)/255.,V=vec3(217.,112.,63.)/255.,U=vec3(110.,90.,60.)/255.;
 vec3 col=U*.5;
 if(q.x>=0&&q.y>=0&&q.x<256&&q.y<256){
  vec4 v=texelFetch(S,q,0);
  float h=floor(v.r*32.+.5);
  col=mix(U,A,clamp(.1+.3*h,0.,1.));
  col=mix(col,U*.6,clamp(v.b*.6,0.,.6));
  col=mix(col,V,clamp(v.g,0.,1.)*.95);
  float cp=u_res.y/(2.*HS);
  if(cp>5.){vec2 f=fract(c);float e=min(min(f.x,1.-f.x),min(f.y,1.-f.y));col*=mix(.6,1.,smoothstep(0.,1.2/cp,e));}
 }
 vec2 uv=gl_FragCoord.xy/u_res-.5;
 col*=1.-.35*dot(uv,uv);
 o=vec4(col,1.);
}`;

// Camera: full grid (beat 1), full grid (beat 2), push-in to a 40 x 40 window (beat 3), pull back (beat 4).
const sm = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const bt = (t, a, b) => sm((t - a) / (b - a));
const hsOf = t => 100 + 28 * bt(t, 4.5, 5.5) - 108 * bt(t, 9.5, 10.5) + 108 * bt(t, 14.5, 15.5);

let sim, setS, pp, steps = 0, seeded = false;
const cv = document.getElementById('c');
glStart(cv, RENDER, { scale: 0.5, frame(st) {
  const gl = st.gl;
  if (!sim) { sim = glProgram(gl, SIM); setS = glSetter(gl, sim); pp = createPingPong(gl, N, N); }
  gl.useProgram(sim); gl.activeTexture(gl.TEXTURE0);
  if (!seeded) {
    seeded = true; gl.bindTexture(gl.TEXTURE_2D, pp.a.tex);
    setS('Z', 1); setS('A', 0); glDraw(gl, pp.b.fb, N, N); pp.swap(); setS('Z', 0);
  }
  for (let n = Math.min(CAP, Math.floor(st.time * SPS) - steps); n > 0; n--) {
    steps++;
    const d = dropAt(steps);
    setS('A', d ? 1 : 0);
    if (d) setS('D', d);
    gl.bindTexture(gl.TEXTURE_2D, pp.a.tex);
    glDraw(gl, pp.b.fb, N, N); pp.swap();
  }
  gl.useProgram(st.prog); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, pp.a.tex);
  st.set('HS', hsOf(st.time));
} });
