<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Four-Grain Toppling Fronts</title>
<style>*{margin:0}html,body{background:#6e5a3c;overflow:hidden}canvas{width:100vw;height:100vh;display:block}</style>
</head><body><canvas id="c"></canvas>
<script type="module">
const GL_HEAD=`#version 300 es
precision highp float;precision highp int;precision highp sampler2D;
uniform float u_time,u_reduced;uniform vec2 u_res,u_mouse;uniform vec4 u_audio;out vec4 o;
`,GL_VS=`#version 300 es
void main(){gl_Position=vec4(vec2(gl_VertexID&1,gl_VertexID>>1)*4.-1.,0,1);}`;function glProgram(e,n,u=GL_VS){const i=e.createProgram();for(const[a,o]of[[e.VERTEX_SHADER,u],[e.FRAGMENT_SHADER,n]]){const t=e.createShader(a);if(e.shaderSource(t,o),e.compileShader(t),!e.getShaderParameter(t,e.COMPILE_STATUS))throw Error("GLSL compile failed: "+e.getShaderInfoLog(t));e.attachShader(i,t)}if(e.linkProgram(i),!e.getProgramParameter(i,e.LINK_STATUS))throw Error("GLSL link failed: "+e.getProgramInfoLog(i));return i}function glSetter(e,n){const u={[e.FLOAT]:"uniform1fv",[e.FLOAT_VEC2]:"uniform2fv",[e.FLOAT_VEC3]:"uniform3fv",[e.FLOAT_VEC4]:"uniform4fv",[e.INT]:"uniform1iv",[e.SAMPLER_2D]:"uniform1iv"},i={};for(let a=e.getProgramParameter(n,e.ACTIVE_UNIFORMS);a--;){const o=e.getActiveUniform(n,a);i[o.name.replace("[0]","")]=[e.getUniformLocation(n,o.name),u[o.type]]}return(a,o)=>{const t=i[a];t&&t[1]&&e[t[1]](t[0],typeof o=="number"?[o]:o)}}const glDraw=(e,n=null,u=e.drawingBufferWidth,i=e.drawingBufferHeight)=>{e.bindFramebuffer(e.FRAMEBUFFER,n),e.viewport(0,0,u,i),e.drawArrays(e.TRIANGLES,0,3)};function glStart(e,n,{scale:u=1,dprMax:i=1,reduce:a=.2,frame:o}={}){const t=e.getContext("webgl2",{antialias:!1});if(!t)throw Error("WebGL2 unavailable");const m=glProgram(t,n.startsWith("#version")?n:GL_HEAD+n),s=matchMedia("(prefers-reduced-motion: reduce)"),r={kind:"webgl2",gl:t,prog:m,set:glSetter(t,m),time:0,reduced:!1,mouse:[.5,.5],audio:[0,0,0,0],raf:0};e.addEventListener("pointermove",c=>{const f=e.getBoundingClientRect();r.mouse=[(c.clientX-f.left)/f.width,1-(c.clientY-f.top)/f.height]});let E=-1;const _=c=>{r.raf=requestAnimationFrame(_);const f=Math.min(devicePixelRatio,i)*u,d=Math.max(1,e.clientWidth*f|0),T=Math.max(1,e.clientHeight*f|0);(e.width!==d||e.height!==T)&&(e.width=d,e.height=T),r.reduced=s.matches,r.time+=E<0?0:Math.min((c-E)/1e3,.5)*(r.reduced?a:1),E=c,o&&o(r),t.useProgram(m),r.set("u_time",r.time),r.set("u_reduced",r.reduced?1:0),r.set("u_res",[d,T]),r.set("u_ // ---- piece: four-grain toppling fronts (abelian sandpile, 200 x 200) ----
const mulberry32=s=>()=>{s=s+1831565813|0;let t=Math.imul(s^s>>>15,1|s);return t=t+Math.imul(t^t>>>7,61|t)^t,((t^t>>>14)>>>0)/4294967296};
const N=200,SPS=24,CAP=8,NONE=[-1,-1];
const rnd=mulberry32(20261126);
const sm=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x)};
const bt=(t,a,b)=>sm((t-a)/(b-a));
const cell=(rad,c=100)=>{
  const a=rnd()*6.2832,r=Math.sqrt(rnd())*rad;
  const cl=v=>Math.min(N-1,Math.max(0,Math.round(v)));
  return [cl(c+Math.cos(a)*r),cl(c+Math.sin(a)*r)];
};
// one drop every 0.5 s of story time (every 12 steps at 24 steps/s)
const dropAt=s=>{
  const tau=s/SPS;
  if(s%12)return NONE;
  if(tau<5)return cell(3);
  if(tau<10)return cell(30);
  if(tau<15)return cell(22);
  if(tau<19)return NONE;
  if(s===456)return[100,100];
  return s%24===0?cell(20):NONE;
};

// Integer heights in red (h/255), flash level in green. Parallel topple: each cell
// sheds 4 grains per topple and receives one grain per neighbour topple.
const SIM=`#version 300 es
precision highp float;precision highp int;
uniform sampler2D S;uniform float K;uniform vec2 D;out vec4 o;
int hi(ivec2 q){return int(texelFetch(S,q,0).r*255.+.5);}
uint wh(uint x){x^=x>>16u;x*=0x7feb352du;x^=x>>15u;x*=0x846ca68bu;x^=x>>16u;return x;}
void main(){
ivec2 p=ivec2(gl_FragCoord.xy);
if(K>0.){int h0=int(wh(uint(p.x)*773u+uint(p.y)*2971u+911u)&3u);o=vec4(float(h0)/255.,0.,0.,1.);return;}
int h=hi(p);float f=texelFetch(S,p,0).g;
int n=0;ivec2 q;
q=p+ivec2(1,0);if(q.x<200)n+=hi(q)/4;
q=p-ivec2(1,0);if(q.x>=0)n+=hi(q)/4;
q=p+ivec2(0,1);if(q.y<200)n+=hi(q)/4;
q=p-ivec2(0,1);if(q.y>=0)n+=hi(q)/4;
int c=h/4;
int nh=h-4*c+n;
if(p==ivec2(D))nh++;
nh=min(nh,250);
float nf=c>0?1.:f*.86;
o=vec4(float(nh)/255.,nf,0.,1.);
}`;

// Umber ground for low heights, apricot for high, vermilion flash on topple.
const RENDER=`uniform sampler2D S;uniform vec2 uCen;uniform float uHh;
void main(){
vec2 uv=gl_FragCoord.xy/u_res;
vec2 p=uCen+(uv-.5)*vec2(u_res.x/u_res.y,1.)*2.*uHh;
vec2 c=floor(p);
vec3 U=vec3(110.,90.,60.)/255.,A=vec3(242.,201.,160.)/255.,V=vec3(217.,112.,63.)/255.;
vec3 col=U*.5;
if(c.x>=0.&&c.y>=0.&&c.x<200.&&c.y<200.){
vec4 s=texelFetch(S,ivec2(c),0);
float h=min(floor(s.r*255.+.5),3.);
col=mix(mix(U,A,h/3.),V,s.g);
}
o=vec4(col,1.);
}`;

let sim,setS,pp,steps=0;
const st=glStart(document.getElementById('c'),RENDER,{scale:1,reduce:0.1,frame(st){
  const gl=st.gl;
  gl.activeTexture(gl.TEXTURE0);
  gl.useProgram(sim||(sim=glProgram(gl,SIM)));
  if(!setS)setS=glSetter(gl,sim);
  if(!pp){
    pp=createPingPong(gl,N,N);
    setS('K',1);setS('D',NONE);
    gl.bindTexture(gl.TEXTURE_2D,pp.a.tex);
    glDraw(gl,pp.b.fb,N,N);pp.swap();
    setS('K',0);
  }
  for(let n=Math.min(CAP,Math.floor(st.time*SPS)-steps);n>0;n--){
    steps++;
    setS('D',dropAt(steps));
    gl.bindTexture(gl.TEXTURE_2D,pp.a.tex);
    glDraw(gl,pp.b.fb,N,N);pp.swap();
  }
  gl.useProgram(st.prog);
  gl.bindTexture(gl.TEXTURE_2D,pp.a.tex);
  // camera: full grid (100 cells half-height), push-in 10-11 s to 20, pull back 15-16 s to 112
  const T=st.time;
  const hh=100+(20-100)*bt(T,10,11)+(112-20)*bt(T,15,16);
  st.set('uCen',[100,100]);
  st.set('uHh',hh);
}});
</script></body></html>
