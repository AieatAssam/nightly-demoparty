<!doctype html>
<html><head><meta charset="utf-8"><title>Four-Grain Toppling Fronts</title>
<style>html,body{margin:0;height:100%;background:#2a2218;overflow:hidden}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}#t{position:fixed;left:14px;bottom:10px;font:12px ui-monospace,Menlo,monospace;color:#f2c9a0;opacity:.7}</style>
</head><body><canvas id="c" width="1280" height="720"></canvas><div id="t">four-grain toppling fronts &middot; threshold 4</div>
<script type="module">
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261126),N=200,H=new Int32Array(N*N),F=new Float32Array(N*N),S=new Float32Array(N*N),D=new Int32Array(N*N);
const red=matchMedia('(prefers-reduced-motion: reduce)').matches,rate=red?0.2:1;
const c=document.getElementById('c'),x=c.getContext('2d'),o=document.createElement('canvas');o.width=o.height=N;const ox=o.getContext('2d'),img=ox.createImageData(N,N),P=img.data;
for(let i=0;i<N*N;i++){const X=i%N-100,Y=(i/N|0)-100,r=Math.max(Math.abs(X),Math.abs(Y));H[i]=r<70?(R()<.55?3:2):(R()*3|0)}
function sweep(){let n=0;D.fill(0);for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){const i=y*N+x;if(H[i]>=4){const q=H[i]>>2;D[i]-=4*q;D[i-1]+=q;D[i+1]+=q;D[i-N]+=q;D[i+N]+=q;F[i]=1;S[i]+=.12;n++}}for(let i=0;i<N*N;i++)H[i]+=D[i];return n}
const ap=[242,201,160],ve=[217,112,63],um=[110,90,60];
let st=0,last=performance.now(),acc=0,nd=0;
function drop(t){const k=t<5?0:6+(t>10&&t<15?4:0)*0;let x0=100,y0=100;if(t>=5&&t<15){x0+=(R()*30|0)-15;y0+=(R()*30|0)-15}H[y0*N+x0]+=t<1?40:6}
function frame(now){const dt=Math.min(.1,(now-last)/1000)*rate;last=now;st+=dt;
while(nd<=st*2){drop(nd/2);nd++}
acc+=dt*50;let k=0;while(acc>=1&&k<6){sweep();acc--;k++}acc=Math.min(acc,1);
const fd=Math.exp(-dt*4);
for(let i=0;i<N*N;i++){F[i]*=fd;S[i]*=Math.exp(-dt*.05);const h=Math.min(H[i],3)/3,s=Math.min(S[i],.6),f=F[i],w=(1-h*.55)*(1-s*.7);
for(let j=0;j<3;j++){const b=um[j]+(ap[j]-um[j])*w;P[i*4+j]=b+(ve[j]-b)*f}P[i*4+3]=255}
ox.putImageData(img,0,0);
const T=st,z=T<9?1:T<11?1+4*ease((T-9)/2):T<14?5:T<16?5-4*ease((T-14)/2):1;
const base=720/N*(T<9?1.1+.15*Math.sin(T*.4):1),sc=base*z*(T>=16?1+.05*Math.sin(T*.3):1);
const cx=100+(z-1)/4*(12*Math.sin(T*.5)),cy=100+(z-1)/4*(10*Math.cos(T*.4));
x.fillStyle='#2a2218';x.fillRect(0,0,1280,720);x.imageSmoothingEnabled=false;
x.drawImage(o,640-cx*sc,360-cy*sc,N*sc,N*sc);requestAnimationFrame(frame)}
function ease(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u)}
requestAnimationFrame(frame);
</script></body></html>
