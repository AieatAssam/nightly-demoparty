// ---- Warren truss, method of joints ----
const N=30,S=Math.sin(Math.PI/3),CO=.5,DEAD=.012,LOOP=24;
const C={g:'#efe3c8',o:'#c8962e',r:'#a84b2a',k:'#3a342e'};
// marker position (panels) at story time t; off-span returns null
const mx=t=>{const x=-1+32*((t%LOOP)/19);return x>=0&&x<=N?x:null};
// solve all diagonal forces for a unit load at x (+ dead load on every bottom node). + = tension
function solve(x,F){
  const L=new Float32Array(N+1).fill(DEAD);
  if(x!==null){const i=Math.min(N-1,Math.floor(x)),f=x-i;L[i]+=1-f;L[i+1]+=f}
  let R0=0;for(let i=0;i<=N;i++)R0+=L[i]*(1-i/N);
  let E=0,Cb=0;
  for(let i=0;i<N;i++){
    const Fy=(i?0:R0)-L[i];
    const D=-Fy/S-E;            // joint B_i, sum Fy
    Cb=Cb+E*CO-D*CO;            // joint B_i, sum Fx (bottom chord)
    E=-D;                       // joint T_i, sum Fy
    F[2*i]=D;F[2*i+1]=E;
  }
  return F;
}
const sgn=(F,j)=>F[j]>1e-6?1:F[j]<-1e-6?-1:0;

// ---- audio: triad pulse + one tone per sign flip, from the same score ----
const fa=new Float32Array(2*N),fb=new Float32Array(2*N);
const play=seq({bpm:120,div:4,seed:24},(ctx,out,t,i)=>{
  const st=i*.125;
  if(i%4==0)sub(ctx,out,t,mtof(48),.35,{vol:.16,cutoff:900});
  if(i%4==2)fm(ctx,out,t,mtof(i%8==2?64:67),.3,{vol:.06,index:1.5});
  solve(mx(Math.max(0,st-.125)),fa);solve(mx(st),fb);
  let n=0;for(let j=0;j<2*N&&n<3;j++){const a=sgn(fa,j),b=sgn(fb,j);if(a&&b&&a!=b){n++;pluck(ctx,out,t+n*.02,mtof(b>0?76+(j%3)*3:52+(j%3)*3),.7,{vol:.22,seed:j+1})}}
});
registerAudioProbe(play);
let T=0,off=null;
for(const e of['pointerdown','keydown'])document.addEventListener(e,()=>{if(off===null)off=T});
startSynth((ctx,out,t0,t1,base)=>play(ctx,out,t0+off,t1+off,base-off));

// ---- visuals ----
const cv=document.getElementById('c'),g=cv.getContext('2d'),RM=matchMedia('(prefers-reduced-motion: reduce)');
const wf=document.createElement('canvas');wf.width=2*N;wf.height=80;const wg=wf.getContext('2d'),row=wg.createImageData(2*N,1);
const hx=h=>[1,3,5].map(k=>parseInt(h.slice(k,k+2),16)),PG=hx(C.g),PO=hx(C.o),PR=hx(C.r);
let rec=0,cyc=-1;const F=new Float32Array(2*N),prev=new Int8Array(2*N),flipT=new Float32Array(2*N).fill(-99);
const cl=v=>v<0?0:v>1?1:v,ease=v=>{v=cl(v);return v*v*(3-2*v)};
function cam(t){
  t%=LOOP;
  if(t<4)return[8,1.7];
  if(t<6)return[15,1];
  if(t<10)return[12,2.4];
  if(t<12.5)return[15.5,2.4];
  if(t<15)return[Math.min(25,mx(t)??25),3.2];
  const k=ease((t-15)/5);return[20+(15-20)*k+Math.sin(t*.3)*.4*k,2.2+(1-2.2)*k];
}

  T+=M<0?0:Math.min((m-M)/1e3,.5)*(RM.matches?.2:1);M=m;
  const c=Math.floor(T/LOOP);if(c!=cyc){cyc=c;rec=0;wg.clearRect(0,0,2*N,80)}

    solve(mx(rec*.25),fa);

  }

  if(wa>0){g.globalAlpha=wa;g.imageSmoothingEnabled=false;const x0=px(0),x1=px(N),y0=H*.6,y1=H*.92;
    g.drawImage(wf,0,0,2*N,rec||1,x0,y0,x1-x0,(y1-y0)*(rec||1)/80);
    g.strokeStyle=C.k;g.lineWidth=1;g.strokeRect(x0-.5,y0-.5,x1-x0+1,y1-y0+1);
    g.fillStyle=C.k;g.font='11px ui-monospace,Menlo,monospace';g.fillText('load position ↓   diagonal →',x0,y0-8);g.globalAlpha=1}
  // chords
  g.strokeStyle=C.k;g.lineCap='round';g.lineWidth=Math.max(1.5,1.2*z);g.beginPath();
  g.moveTo(px(0),yb);g.lineTo(px(N),yb);g.moveTo(px(.5),yt);g.lineTo(px(N-.5),yt);g.stroke();
  // diagonals: colour = sign, width = |force|, halo eases out after a flip
  for(let j=0;j<2*N;j++){
    const i=j>>1,a=j&1?[i+.5,yt,i+1,yb]:[i,yb,i+.5,yt],f=F[j],col=f>0?C.o:C.r,w=(1.2+Math.abs(f)*6)*Math.pow(z,.7);
    const h=Math.exp(-(T-flipT[j])/.8);
    if(h>.02){g.globalAlpha=.3*h;g.strokeStyle=col;g.lineWidth=w+10*z*h;g.beginPath();g.moveTo(px(a[0]),a[1]);g.lineTo(px(a[2]),a[3]);g.stroke();g.globalAlpha=1}
    g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(px(a[0]),a[1]);g.lineTo(px(a[2]),a[3]);g.stroke();
  }
  // joints
  const r=Math.max(2.5,2.4*z);g.fillStyle=C.g;g.strokeStyle=C.k;g.lineWidth=1.2;g.beginPath();
  for(let i=0;i<=N;i++){g.moveTo(px(i)+r,yb);g.arc(px(i),yb,r,0,7)}
  for(let i=0;i<N;i++){g.moveTo(px(i+.5)+r,yt);g.arc(px(i+.5),yt,r,0,7)}
  g.fill();g.stroke();
  // supports
  g.fillStyle=C.k;for(const v of[0,N]){g.beginPath();g.moveTo(px(v),yb+r);g.lineTo(px(v)-.3*u,yb+.45*u);g.lineTo(px(v)+.3*u,yb+.45*u);g.fill()}
  // load marker: one weight on the bottom chord
  if(x!==null){const X=px(x),s=.32*u;g.fillStyle=C.k;g.fillRect(X-s,yt-2.2*s-1.4*s,2*s,1.4*s);
    g.lineWidth=Math.max(1.5,z);g.strokeStyle=C.k;g.beginPath();g.moveTo(X,yt-2.2*s);g.lineTo(X,yb-r-s*.6);g.stroke();
    g.beginPath();g.moveTo(X,yb-r);g.lineTo(X-s*.4,yb-r-s*.7);g.lineTo(X+s*.4,yb-r-s*.7);g.fill()}
  // title block
  g.fillStyle=C.k;g.font='12px ui-monospace,Menlo,monospace';g.fillText('WARREN 1848',24,H-40);
  g.fillStyle=C.o;g.fillText('■ tension',24,H-22);g.fillStyle=C.r;g.fillText('■ compression',120,H-22);
}
requestAnimationFrame(frame);
