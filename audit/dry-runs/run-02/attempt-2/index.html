// ---- Warren truss: method-of-joints solver, equal-length members (panel 1, h = sqrt(3)/2).
const N = 30, HT = Math.sqrt(3) / 2, GRAPH = '#3a342e', OCHRE = [200, 150, 46], RUST = [168, 75, 42];
const LOAD_T = 17, SEED = 3;
// bottom joints 0..N at (i,0); top joints N+1+i at (i+0.5, HT)
const pos = j => j <= N ? [j, 0] : [j - N - 1 + 0.5, HT];
const MEM = [];
for (let i = 0; i < N; i++) MEM.push([i, i + 1]);              // bottom chords
for (let i = 0; i < N - 1; i++) MEM.push([N + 1 + i, N + 2 + i]); // top chords
for (let i = 0; i < N; i++) MEM.push([i, N + 1 + i]);          // diagonals B_i-T_i
for (let i = 0; i < N; i++) MEM.push([N + 1 + i, i + 1]);      // diagonals T_i-B_{i+1}
const NM = MEM.length, NU = NM + 3, NR = 2 * (2 * N + 1), K = N + 1;
const DIAG = [];
for (let i = 0; i < 2 * N; i++) DIAG.push(2 * N - 1 + i);     // member ids of the 2N diagonals
const DIDX = new Int32Array(NM).fill(-1);
DIAG.forEach((m, d) => DIDX[m] = d);

  const [ax, ay] = pos(a), [bx, by] = pos(b), L = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / L, uy = (by - ay) / L;

});

for (let k = 0; k <= N; k++) M[2 * k + 1][NU + k] = 1;

  let p = c;
  for (let r = c + 1; r < NR; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
  [M[c], M[p]] = [M[p], M[c]];
  const pv = M[c][c];
  for (let r = c + 1; r < NR; r++) {
    const f = M[r][c] / pv;
    if (f) for (let q = c; q < NU + K; q++) M[r][q] -= f * M[c][q];
  }

  const x = new Float64Array(NU);
  for (let r = NU - 1; r >= 0; r--) {
    let s = M[r][NU + q];
    for (let c = r + 1; c < NU; c++) s -= M[r][c] * x[c];
    x[r] = s / M[r][r];

  const xc = Math.min(Math.max(x, 0), N), k = Math.min(N - 1, Math.floor(xc)), f = xc - k;

// precomputed sign flips of every diagonal as the load sweeps the span
const FLIPS = [];
DIAG.forEach((m, d) => {
  let prev = 0;
  for (let s = 0; s <= 600; s++) {
    const x = s / 600 * N, F = FAT(m, x), sg = F > EPS ? 1 : F < -EPS ? -1 : 0;

  }

FLIPS.sort((a, b) => a.t - b.t);

// ---- sound: 120 BPM triad pulse from t = 0; each flip sounds a sine (high tension, low compression)

  const o = ctx.createOscillator(), g = ctx.createGain();

  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(1e-4, t + 0.7);

// ---- render
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W = 0, Hh = 0;
const fit = () => { W = cv.width = innerWidth; Hh = cv.height = innerHeight; };
fit(); addEventListener('resize', fit);
const clock = storyClock({ reduce: 0.2 });

  const x = XT(t);

  cx.fillStyle = '#efe3c8';
  cx.fillRect(0, 0, W, Hh);
  for (const [sg, al] of [[-1, 0.28], [1, 1]]) {
    cx.globalAlpha = al;
    // settle (beat 4): panels fill with the colour of their two diagonals, so the 20 s frame gains colour mass
    if (SETTLE > 0) {
      cx.globalAlpha = al * SETTLE * 0.9;
      for (let i = 0; i < N; i++) {
        cx.fillStyle = rgbOf((ST[i] + ST[N + i]) / 2);
        cx.beginPath(); cx.moveTo(sx(i), sy(0)); cx.lineTo(sx(i + 1), sy(0)); cx.lineTo(sx(i + 0.5), sy(HT * sg)); cx.closePath(); cx.fill();
      }
      cx.globalAlpha = al;
    }
    for (let m = 0; m < NM; m++) {
      const [a, b] = MEM[m], [xa, ya] = pos(a), [xb, yb] = pos(b), d = DIDX[m];
      cx.strokeStyle = d >= 0 ? rgbOf(ST[d]) : GRAPH;
      cx.lineWidth = (1 + 3.2 * Math.abs(FNOW[m]) / FMAX) * lw;
      cx.beginPath(); cx.moveTo(sx(xa), sy(ya * sg)); cx.lineTo(sx(xb), sy(yb * sg)); cx.stroke();
    }
    for (let j = 0; j <= 2 * N; j++) {
      const [px, py] = pos(j), qx = sx(px), qy = sy(py * sg);
      cx.fillStyle = GRAPH; cx.beginPath(); cx.arc(qx, qy, 2.6 * lw, 0, 6.2832); cx.fill();
      cx.fillStyle = '#efe3c8'; cx.beginPath(); cx.arc(qx, qy, 1.1 * lw, 0, 6.2832); cx.fill();
    }
  }
  cx.globalAlpha = 1;
  // flip rings: each sign change sends a ring out from its diagonal for 0.9 s
  for (const e of FLIPS) {
    const age = t - e.t;
    if (age < 0) break;
    if (age > 0.9) continue;
    const [a, b] = MEM[DIAG[e.d]], [xa, ya] = pos(a), [xb, yb] = pos(b);
    cx.strokeStyle = GRAPH; cx.globalAlpha = 0.7 * (1 - age / 0.9); cx.lineWidth = 1.2;
    cx.beginPath(); cx.arc(sx((xa + xb) / 2), sy((ya + yb) / 2), (4 + 22 * age / 0.9) * lw, 0, 6.2832); cx.stroke();
  }
  // load marker on the bottom chord
  cx.globalAlpha = 1;
  cx.fillStyle = GRAPH; cx.beginPath(); cx.arc(sx(x), sy(0), 6, 0, 6.2832); cx.fill();
  cx.strokeStyle = '#efe3c8'; cx.lineWidth = 1.5; cx.stroke();

  cx.fillStyle = GRAPH; cx.font = '12px ui-monospace,Menlo,monospace';
  cx.fillText('WARREN TRUSS  30 PANELS  MIRRORED', 16, 24);
  cx.fillText('OCHRE = TENSION   RUST = COMPRESSION', 16, Hh - 18);

}
