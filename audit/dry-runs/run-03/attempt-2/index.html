<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fungal Sink</title>
<style>*{margin:0}html,body{height:100%;background:#efe3c8;overflow:hidden}canvas{width:100vw;height:100vh;display:block}</style>
</head><body><canvas id="c"></canvas>
<script type="module">
const mulberry32=s=>()=>{s=s+1831565813|0;let t=Math.imul(s^s>>>15,1|s);return t=t+Math.imul(t^t>>>7,61|t)^t,((t^t>>>14)>>>0)/4294967296};
const rnd=mulberry32(20261125);
const clamp01=x=>x<0?0:x>1?1:x;
const smooth=x=>(x=clamp01(x),x*x*(3-2*x));
const beat=(t,a,b)=>smooth((t-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
const RM=matchMedia('(prefers-reduced-motion: reduce)');
let st=0,lastMs=-1;
const storyTime=ms=>{st+=lastMs<0?0:Math.min((ms-lastMs)/1000,.5)*(RM.matches?0.2:1);lastMs=ms;return st};

const GROUND='#efe3c8',OCHRE='#c98a3a',RUST='#9c4a2a',AMBER='#e0b050',GRAPH='#3b2a20';
const W0=1280,H0=720,CX=640,CY=330;
const NODES=[[200,560,OCHRE],[470,585,AMBER],[790,585,GRAPH],[1060,560,RUST]];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let WW=1280,HH=720;

const quad=(a,b,c,n)=>{const o=[];for(let k=0;k<=n;k++){const t=k/n,u=1-t;o.push(u*u*a[0]+2*u*t*b[0]+t*t*c[0],u*u*a[1]+2*u*t*b[1]+t*t*c[1])}return o};
const resample=(p,n)=>{const m=p.length>>1,L=[0];for(let i=1;i<m;i++)L[i]=L[i-1]+Math.hypot(p[2*i]-p[2*i-2],p[2*i+1]-p[2*i-1]);const T=L[m-1],o=[];let j=0;for(let k=0;k<n;k++){const d=T*k/(n-1);while(j<m-2&&L[j+1]<d)j++;const f=(d-L[j])/((L[j+1]-L[j])||1);o.push(p[2*j]+(p[2*j+2]-p[2*j])*f,p[2*j+1]+(p[2*j+3]-p[2*j+1])*f)}return o};
const walk=(x,y,a,n,len,pull)=>{const o=[x,y];for(let k=0;k<n;k++){a+=Math.sin(Math.atan2(CY-y,CX-x)-a)*pull+(rnd()-.5)*.9;x+=Math.cos(a)*len;y+=Math.sin(a)*len;o.push(x,y)}return o};
const poly=(p,path)=>{path.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)path.lineTo(p[i],p[i+1]);return path};

// trunks: one hypha per canopy node, resampled by arc length (200 points, flat x,y)
const TR=NODES.map(([x,y])=>{const wx=CX+(x-CX)*.2,wy=400;return resample(quad([x,y-24],[(x+wx)/2+(rnd()-.5)*140,(y+wy)/2],[wx,wy],60),200)});
const ROOT=NODES.map(([x,y])=>{const p=new Path2D();for(let k=0;k<5;k++)poly(walk(x+(rnd()-.5)*30,y+20,Math.PI/2+(rnd()-.5)*.9,4,12+rnd()*8,0),p);return p});
// central web (inward random walks) and side hyphae
const WEB=[];for(let k=0;k<44;k++){const a=rnd()*6.283,r=30+rnd()*150;WEB.push(walk(CX+Math.cos(a)*r,CY+Math.sin(a)*r,a+3.14,7+(rnd()*5|0),11+rnd()*6,.35))}
const SIDE=[];for(const tp of TR)for(let k=0;k<6;k++){const q=(20+(rnd()*150|0))*2;SIDE.push(walk(tp[q],tp[q+1],rnd()*6.283,5,9+rnd()*5,0))}
const SIDEP=new Path2D(),TRP=new Path2D();
SIDE.forEach(p=>poly(p,SIDEP));TR.forEach(p=>poly(p,TRP));

// Gray-Scott reaction-diffusion on a 128x72 grid, active only near the web
const GW=192,GH=108,CELL=W0/GW,FD=.03,FK=.062;
let U=new Float32Array(GW*GH).fill(1),V=new Float32Array(GW*GH),U2=new Float32Array(GW*GH),V2=new Float32Array(GW*GH);
const MASK=new Uint8Array(GW*GH);
for(let j=0;j<GH;j++)for(let i=0;i<GW;i++)MASK[j*GW+i]=Math.hypot(i*CELL+5-CX,j*CELL+5-CY)<300?1:0;
function gsStep(){
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){
    const k=j*GW+i;
    if(!MASK[k]){U2[k]=U[k];V2[k]=V[k];continue}
    const l=((j+GH-1)%GH)*GW+i,r=((j+1)%GH)*GW+i,a=j*GW+(i+GW-1)%GW,b=j*GW+(i+1)%GW;
    const u=U[k],v=V[k],uvv=u*v*v;
    U2[k]=u+.2*(U[l]+U[r]+U[a]+U[b]-4*u)-uvv+FD*(1-u);
    V2[k]=v+.1*(V[l]+V[r]+V[a]+V[b]-4*v)+uvv-(FD+FK)*v;
  }
  let tu=U;U=U2;U2=tu;
  let tv=V;V=V2;V2=tv;
}
const seedAt=(x,y)=>{const i=x/CELL|0,j=y/CELL|0;for(let dj=-1;dj<2;dj++)for(let di=-1;di<2;di++){const ii=(i+di+GW)%GW,jj=(j+dj+GH)%GH,k=jj*GW+ii;if(MASK[k]){V[k]=1;U[k]=.5}}};
TR.forEach(p=>{for(let k=0;k<p.length;k+=16)seedAt(p[k],p[k+1])});
WEB.forEach(p=>{for(let k=0;k<p.length;k+=12)if(rnd()<.25)seedAt(p[k],p[k+1])});
for(let n=0;n<160;n++)gsStep();
const gc=document.createElement('canvas');gc.width=GW;gc.height=GH;
const gx=gc.getContext('2d'),GI=gx.createImageData(GW,GH);
function gsDraw(){const d=GI.data;for(let k=0;k<GW*GH;k++){d[4*k]=156;d[4*k+1]=74;d[4*k+2]=42;d[4*k+3]=Math.min(1,V[k]*3)*255}gx.putImageData(GI,0,0)}

// dots: fixed pool of 3000, each rides one hypha; flow sign per branch
const MAXD=3000,DS=new Float32Array(MAXD),DV=new Float32Array(MAXD),DB=new Uint8Array(MAXD),DX=new Float32Array(MAXD),DY=new Float32Array(MAXD),DG=new Uint8Array(MAXD);
for(let i=0;i<MAXD;i++){DS[i]=rnd();DV[i]=.16+.12*rnd();DB[i]=i&3}
const FL=[1,1,1,1];
const KT=[0,5,10,11,15,20],KN=[150,400,1200,3000,3000,1800];
const nAct=t=>{let i=0;while(i<KT.length-2&&t>=KT[i+1])i++;return Math.round(KN[i]+(KN[i+1]-KN[i])*clamp01((t-KT[i])/(KT[i+1]-KT[i])))};
// hard cuts at 3, 6.5, 11, 16 s; one eased pull-back after 16 s
const camAt=t=>t<3?[1,CX,CY]:t<6.5?[.82,CX,CY]:t<11?[1.2,700,380]:t<16?[1,CX,CY]:[lerp(1.15,.9,beat(t,16,20)),CX,CY];
function setCam(z,cx,cy,S){ctx.setTransform(S*z,0,0,S*z,WW/2-S*z*cx,HH/2-S*z*cy)}

let T=0,DIM=0,BW=0,BT=0,NVIS=0,WEBP=null,NACT=0,tPrev=0,sTick=0;
function layer(a){
  ctx.globalAlpha=a*.6;ctx.drawImage(gc,0,0,W0,H0);
  const g=ctx.createRadialGradient(CX,CY,0,CX,CY,240);
  g.addColorStop(0,`rgba(156,74,42,${.1+.12*BT})`);g.addColorStop(1,'rgba(156,74,42,0)');
  ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(0,0,W0,H0);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=GRAPH;
  ctx.globalAlpha=a*.3;ctx.lineWidth=1;ctx.stroke(SIDEP);
  ctx.globalAlpha=a*(.35+.15*BW);ctx.lineWidth=1+2.2*BW;ctx.stroke(WEBP);
  ctx.globalAlpha=a*.45;ctx.lineWidth=2.2;ctx.stroke(TRP);
  NODES.forEach(([x,y,c],i)=>{
    const d=i===3?DIM:0;
    ctx.globalAlpha=a*.6*(1-.85*d);ctx.lineWidth=1.2;ctx.stroke(ROOT[i]);
    ctx.globalAlpha=a*(1-.7*d);ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,20,0,6.2832);ctx.fill();
  });
  const P=[new Path2D(),new Path2D(),new Path2D(),new Path2D(),new Path2D()];
  for(let i=0;i<NACT;i++){const k=DG[i],r=k===4?4:3,p=P[k];p.moveTo(DX[i]+r,DY[i]);p.arc(DX[i],DY[i],r,0,6.2832)}
  ctx.globalAlpha=a*.92;
  [OCHRE,AMBER,GRAPH,RUST,GRAPH].forEach((c,k)=>{ctx.fillStyle=c;ctx.fill(P[k])});
}

function frame(ms){
  requestAnimationFrame(frame);
  const t=storyTime(ms);T=t;
  const dpr=Math.min(devicePixelRatio||1,1);
  const w=Math.max(1,cv.clientWidth*dpr|0),h=Math.max(1,cv.clientHeight*dpr|0);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  WW=w;HH=h;const S=Math.min(w/W0,h/H0);
  for(let n=0;sTick<t*20&&n<4;n++){gsStep();sTick++}
  gsDraw();
  const dt=Math.min(.1,Math.max(0,t-tPrev));tPrev=t;
  DIM=beat(t,6.3,7.2);BW=beat(t,4.5,9.5);BT=beat(t,4,10);
  FL[3]=1-2*beat(t,6.6,7.8);
  NVIS=Math.floor(WEB.length*(.3+.7*smooth(t/4)));
  WEBP=new Path2D();for(let i=0;i<NVIS;i++)poly(WEB[i],WEBP);
  NACT=nAct(t);
  for(let i=0;i<NACT;i++){
    const b=DB[i],f=FL[b];
    let s=DS[i]+DV[i]*f*dt;
    if(s>1)s=f>0?0:1;else if(s<0)s=f<0?1:0;
    DS[i]=s;
    const q=(s*199+.5|0)*2;
    DX[i]=TR[b][q];DY[i]=TR[b][q+1];DG[i]=f<-.3?4:b;
  }
  const [z,cx,cy]=camAt(t);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle=GROUND;ctx.fillRect(0,0,w,h);
  setCam(z,cx,cy,S);layer(1);
  if(t>=11){setCam(z,cx,cy,S);ctx.translate(W0,H0);ctx.scale(-1,-1);layer(.6)}
  // shade band sweeps across the rust node and dims it
  const bc=lerp(1400,1020,beat(t,6,8.5)),ba=.32*beat(t,6,6.9)*(1-beat(t,9.5,10.5));
  if(ba>.001){
    setCam(z,cx,cy,S);
    const bg=ctx.createLinearGradient(bc-260,0,bc+260,0);
    bg.addColorStop(0,'rgba(59,42,32,0)');bg.addColorStop(.5,`rgba(59,42,32,${ba})`);bg.addColorStop(1,'rgba(59,42,32,0)');
    ctx.globalAlpha=1;ctx.fillStyle=bg;ctx.fillRect(0,0,W0,H0);
  }
}
requestAnimationFrame(frame);
</script>
</body></html>
