<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fungal Sink</title>
<style>*{margin:0}body{background:#efe3c8;overflow:hidden}canvas{width:100vw;height:100vh;display:block}
#t{position:fixed;left:18px;bottom:14px;font:11px ui-monospace,Menlo,monospace;color:#3b2a20;opacity:.6}</style></head>
<body><canvas id="c"></canvas><div id="t">fungal sink pull / shade reversal</div>
<script type="module">
const mulberry32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rnd=mulberry32(20261125);
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const W=1280,H=720,HUB=[640,300];
const COL=['#c98a3a','#e0b050','#3b2a20','#9c4a2a'];
const NODES=[[256,560],[512,560],[768,560],[1024,560]];
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
// hyphae: trunk then 3 branches per node, resampled to 64 pts
const walk=(a,b,n,j)=>{const p=[];for(let i=0;i<=n;i++){const u=i/n,e=Math.sin(u*Math.PI)*j;p.push([a[0]+(b[0]-a[0])*u+(rnd()-.5)*e,a[1]+(b[1]-a[1])*u+(rnd()-.5)*e])}return p};
const resample=p=>{const L=[0];for(let i=1;i<p.length;i++)L.push(L[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));const T=L[L.length-1],o=[];let k=0;
for(let i=0;i<64;i++){const d=T*i/63;while(k<p.length-2&&L[k+1]<d)k++;const f=(d-L[k])/((L[k+1]-L[k])||1);o.push([p[k][0]+(p[k+1][0]-p[k][0])*f,p[k][1]+(p[k+1][1]-p[k][1])*f])}return o};
const PATHS=[],OWN=[];
NODES.forEach((n,i)=>{const m=[n[0]+(HUB[0]-n[0])*.45+(rnd()-.5)*60,n[1]+(HUB[1]-n[1])*.45];const tr=walk(n,m,6,22);
for(let b=0;b<3;b++){const end=[HUB[0]+(rnd()-.5)*160,HUB[1]+(rnd()-.5)*100];PATHS.push(resample(tr.concat(walk(m,end,7,36).slice(1))));OWN.push(i)}});
const RUST=3,phase=new Float32Array(PATHS.length);
// dots
const ND=3000,DP=new Uint8Array(ND),DS=new Float32Array(ND),DV=new Float32Array(ND);
for(let i=0;i<ND;i++){DP[i]=rnd()*PATHS.length|0;DS[i]=rnd();DV[i]=.8+rnd()*.5}
const DQ=new Float32Array(ND*2),DC=new Uint8Array(ND);for(let i=0;i<ND;i++)DC[i]=OWN[DP[i]];
const at=(p,s)=>{const f=s*63,k=Math.min(62,f|0),u=f-k,a=p[k],b=p[k+1];return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u]};
// Gray-Scott on 160x90 grid (8px cells), confined near hyphae, grows from hub outward
const GW=160,GH=90,GN=GW*GH;let U=new Float32Array(GN).fill(1),V=new Float32Array(GN),U2=new Float32Array(GN),V2=new Float32Array(GN);
const MS=new Float32Array(GN).fill(9);
PATHS.forEach(p=>{for(let i=0;i<64;i++){const gx=p[i][0]/8|0,gy=p[i][1]/8|0;for(let dy=-6;dy<=6;dy++)for(let dx=-6;dx<=6;dx++){const x=gx+dx,y=gy+dy;if(x<0||y<0||x>=GW||y>=GH||dx*dx+dy*dy>36)continue;const j=y*GW+x;MS[j]=Math.min(MS[j],1-i/63)}}});
for(let s=0;s<14;s++){const p=PATHS[rnd()*PATHS.length|0],q=at(p,.7+rnd()*.3),gx=q[0]/8|0,gy=q[1]/8|0;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const j=(gy+dy)*GW+gx+dx;U[j]=.5;V[j]=.25}}
let reach=.3;
const gsStep=()=>{for(let y=1;y<GH-1;y++)for(let x=1;x<GW-1;x++){const j=y*GW+x,u=U[j],v=V[j];
if(MS[j]>reach){U2[j]=1;V2[j]=v*.8;continue}
const lu=U[j-1]+U[j+1]+U[j-GW]+U[j+GW]-4*u,lv=V[j-1]+V[j+1]+V[j-GW]+V[j+GW]-4*v,r=u*v*v;
U2[j]=u+.2*lu-r+.0367*(1-u);V2[j]=v+.1*lv+r-.1016*v}[U,U2]=[U2,U];[V,V2]=[V2,V]};
for(let i=0;i<300;i++)gsStep();
const gc=document.createElement('canvas');gc.width=GW;gc.height=GH;const gx=gc.getContext('2d'),img=gx.createImageData(GW,GH);
const gsDraw=()=>{const d=img.data;for(let j=0;j<GN;j++){const a=Math.min(1,Math.max(0,(V[j]-.04)*2.6));d[j*4]=156;d[j*4+1]=74;d[j*4+2]=42;d[j*4+3]=a*170}gx.putImageData(img,0,0)};
// clock
let T=0,M=-1,steps=300;
const scene=(t,sh)=>{
 cx.imageSmoothingEnabled=true;cx.drawImage(gc,0,0,W,H);
 const g=sm(0,14,t);
 cx.strokeStyle='rgba(59,42,32,'+(.35+.3*g)+')';cx.lineWidth=.8+1.6*g;cx.lineCap='round';
 cx.beginPath();for(const p of PATHS){cx.moveTo(p[0][0],p[0][1]);for(let i=1;i<64;i++)cx.lineTo(p[i][0],p[i][1])}cx.stroke();
 // root tips
 NODES.forEach((n,i)=>{const a=i==RUST?1-.85*sh:1;cx.strokeStyle='rgba(59,42,32,'+(.5*a)+')';cx.lineWidth=1.2;cx.beginPath();
  for(let k=0;k<6;k++){const an=Math.PI*(.25+k*.1);cx.moveTo(n[0],n[1]);cx.lineTo(n[0]+Math.cos(an)*48*(i==RUST?1-.5*sh:1),n[1]+Math.sin(an)*48)}cx.stroke()});
 // shadow band
 const bx=1500-470*sm(5,7.5,t),bg=cx.createLinearGradient(bx-220,0,bx+220,0);
 bg.addColorStop(0,'rgba(59,42,32,0)');bg.addColorStop(.5,'rgba(59,42,32,'+(.22*sm(4.5,6.5,t))+')');bg.addColorStop(1,'rgba(59,42,32,0)');
 cx.fillStyle=bg;cx.fillRect(bx-220,-500,440,1700);
 // nodes with soft glow + shading
 NODES.forEach((n,i)=>{const dim=i==RUST?sh:0;
  const gl=cx.createRadialGradient(n[0],n[1],10,n[0],n[1],70);gl.addColorStop(0,COL[i]+'66');gl.addColorStop(1,COL[i]+'00');
  cx.globalAlpha=1-.8*dim;cx.fillStyle=gl;cx.fillRect(n[0]-70,n[1]-70,140,140);
  const r=cx.createRadialGradient(n[0]-8,n[1]-9,2,n[0],n[1],24);r.addColorStop(0,'#efe3c8');r.addColorStop(.35,COL[i]);r.addColorStop(1,'#3b2a20');
  cx.globalAlpha=1-.55*dim;cx.fillStyle=r;cx.beginPath();cx.arc(n[0],n[1],22,0,7);cx.fill();cx.globalAlpha=1});
 // dots
 const n=Math.min(ND,1500+1500*sm(2,12,t)|0);
 for(let c=0;c<4;c++){cx.fillStyle=COL[c];cx.beginPath();
  for(let i=0;i<n;i++)if(DC[i]==c)cx.rect(DQ[i*2]-1.6,DQ[i*2+1]-1.6,3.2,3.2);cx.fill()}
 // reversed-stream marks: amber chevrons on rust hyphae pointing back to the shaded node
 if(sh>0){cx.fillStyle='rgba(224,176,80,'+sh+')';for(let i=0;i<n;i+=3){const p=DP[i];if(OWN[p]!=RUST)continue;const s=((DS[i]+phase[p]*DV[i])%1+1)%1,q=at(PATHS[p],s),r=at(PATHS[p],Math.max(0,s-.02));
  const dx=r[0]-q[0],dy=r[1]-q[1],l=Math.hypot(dx,dy)||1,ux=dx/l*5,uy=dy/l*5;cx.beginPath();cx.moveTo(q[0]+ux,q[1]+uy);cx.lineTo(q[0]-uy*.7,q[1]+ux*.7);cx.lineTo(q[0]+uy*.7,q[1]-ux*.7);cx.fill()}}
};
const f=m=>{requestAnimationFrame(f);
 if(cv.width!=640){cv.width=640;cv.height=360}
 const dt=M<0?0:Math.min((m-M)/1e3,.5)*(RM.matches?.2:1);M=m;T+=dt;const t=T;
 const sh=sm(6.2,7.4,t);
 const sp=.06*(1+.25*Math.sin(t*Math.PI*4*(RM.matches?.2:1)))*(1-.45*sm(16,20,t));
 for(let p=0;p<PATHS.length;p++)phase[p]+=dt*sp*(OWN[p]==RUST?1-2*sh:1);
 for(let i=0;i<ND;i++){const p=DP[i],q=at(PATHS[p],((DS[i]+phase[p]*DV[i])%1+1)%1);DQ[i*2]=q[0];DQ[i*2+1]=q[1]}
 reach=.3+.75*sm(0,14,t);
 for(let n=Math.min(6,(300+t*30|0)-steps);n>0;n--){gsStep();steps++}gsDraw();
 // camera: hard cuts at 3, 6.5, 11, 16; eased pull-back after 16
 let z,c,mir=0;
 if(t<3){z=1.3;c=[640,420]}else if(t<6.5){z=1;c=[640,360]}else if(t<11){z=1.75;c=[900,470]}
 else if(t<16){z=1.05;c=HUB;mir=1}else{z=1.15-.5*sm(16,20,t);c=HUB;mir=1}
 const k=.5;cx.setTransform(k,0,0,k,0,0);cx.fillStyle='#efe3c8';cx.fillRect(0,0,W,H);
 const vg=cx.createRadialGradient(640,360,200,640,360,800);vg.addColorStop(0,'rgba(201,138,58,0)');vg.addColorStop(1,'rgba(156,74,42,.18)');
 cx.setTransform(z*k,0,0,z*k,(W/2-c[0]*z)*k,(H/2-c[1]*z)*k);scene(t,sh);
 if(mir){cx.setTransform(-z*k,0,0,-z*k,(W/2+(2*HUB[0]-c[0])*z)*k,(H/2+(2*HUB[1]-c[1])*z)*k);cx.globalAlpha=.85;scene(t,sh);cx.globalAlpha=1}
 cx.setTransform(k,0,0,k,0,0);cx.fillStyle=vg;cx.fillRect(0,0,W,H)};
requestAnimationFrame(f);
</script></body></html>
