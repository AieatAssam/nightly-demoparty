// Von Karman street: analytic alternating point vortices advect a ping-pong dye field.
// Dye is injected only at the two shear layers; R = rust (clockwise, top), G = ochre (counterclockwise, bottom).
const SIM_W = 512, SIM_H = 256, SPS = 30, CAP = 8;
const SIM = GL_HEAD + `uniform sampler2D S;uniform float T,W;
float h2(vec2 p){uvec2 q=uvec2(ivec2(floor(p))+65536);uint h=(q.x*1664525u)^(q.y*1013904223u);h^=h>>13u;h*=1274126177u;h^=h>>16u;return float(h)*2.3283064e-10;}
float vn(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1,0)),u.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),u.x),u.y);}
vec2 vort(vec2 p){vec2 v=vec2(0.);float n0=floor(T);
for(int m=0;m<10;m++){float n=n0-float(m);if(n<0.)continue;
float a=T-n,s=mod(n,2.)<.5?1.:-1.;vec2 c=vec2(.2+2.4*a,s*1.1),d=p-c;
v+=-s*4.*exp(-.18*a)/6.2832*vec2(-d.y,d.x)/(dot(d,d)+.06);}
return v;}
void main(){
vec2 uv=gl_FragCoord.xy/vec2(textureSize(S,0)),p=vec2(-8.,-8.)+uv*vec2(32.,16.);
if(length(p)<1.02){o=vec4(0.);return;}
vec2 wq=vec2(vn(p*.35+vec2(0.,.1*T)),vn(p*.35+vec2(5.2,1.3+.1*T)));
vec2 v=vec2(2.4,0.)+vort(p)+(wq-.5)*1.1;
vec2 q=(p-v/30.-vec2(-8.,-8.))/vec2(32.,16.);
float mk=step(0.,q.x)*step(q.x,1.)*step(0.,q.y)*step(q.y,1.);

const RENDER = `uniform sampler2D S;uniform float CX,HH;

const cv = document.getElementById('c');
let sim, setS, pp, steps = 0;
