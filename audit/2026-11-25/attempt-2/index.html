<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fixed-Lag Side Branches on a Dendrite Tip</title>
<style>*{margin:0}html,body{height:100%;overflow:hidden;background:#b8665a}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas>
<script type="module">
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const GROUND = '#d8a193', CLAY = '#b8665a', OX = '#7a2636';
const OM = 1.047, D0 = 120, V0 = 15, R0 = 36, LAG = 30, SP = 16, G = 9, NS = 24;
const LET = 'defect', TAU_SIDE = Math.PI / 3;

// Tip position D(t) and tip speed V(t) = dD/dt. Sharpness lock: R = R0 * sqrt(V0 / V), so V * R^2 stays constant.
const D = t => D0 + V0 * (t + 0.55 * (Math.cos(0.8) - Math.cos(OM * t + 0.8)) / OM);
const VEL = t => V0 * (1 + 0.55 * Math.sin(OM * t + 0.8));
// Inverse of D by bisection: the story time at which the tip reaches distance d.
const inv = d => { let a = -60, b = 400; for (let i = 0; i < 50; i++) { const m = (a + b) / 2; if (D(m) < d) a = m; else b = m; } return (a + b) / 2; };

// Defect sites sit at a constant lag LAG behind the tip when they form. Sites 0..5 are the letters of "defect".
const SITE = [];
for (let n = 0; n < NS; n++) {
  const r = D0 - LAG + SP * (n - 5);
  const A = Math.max(0, inv(r + LAG));
  const start = n < 6 ? Math.max(A, 2.5 + 0.7 * n) : A;
  SITE.push({ r, start, freeze: start + 2 + 1.5 * n, sg: n % 2 ? 1 : -1 });
}
// Side-arm length: early sites freeze short, later sites keep extending.
const sideLen = (q, t) => Math.min(120, G * Math.max(0, Math.min(t, q.freeze) - q.start));

const ease = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
// Camera scale by beat. Hard cuts at 11 s and 13 s.
const zoom = t => t < 5 ? 2.7 - 0.5 * ease(t / 5)
  : t < 10 ? 2.2 - 1.0 * ease((t - 5) / 5)
  : t < 11 ? 1.2
  : t < 13 ? 0.8
  : t < 15 ? 1.6
  : 1.6 - 1.05 * ease((t - 15) / 5);

const drawFrame = t => {
  const W = cv.width, H = cv.height, S = Math.min(W, H) / 720, Z = zoom(t) * S;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.hypot(W, H) / 2);
  g.addColorStop(0, GROUND); g.addColorStop(1, CLAY);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.translate(W / 2, H / 2); ctx.scale(Z, Z);
  ctx.lineCap = 'round';

  const d = D(t), v = VEL(t), R = R0 * Math.sqrt(V0 / v), tipL = 3 * R, x0 = d - tipL;
  for (let a = 0; a < 6; a++) {
    ctx.save(); ctx.rotate(Math.PI / 6 + a * Math.PI / 3);
    for (let n = 0; n < NS; n++) {
      const q = SITE[n], len = sideLen(q, t);
      if (len <= 0.01) continue;
      const ang = q.sg * TAU_SIDE, ex = q.r + len * Math.cos(ang), ey = len * Math.sin(ang);
      ctx.beginPath(); ctx.moveTo(q.r, 0); ctx.lineTo(ex, ey);
      ctx.strokeStyle = OX; ctx.lineWidth = 3.2; ctx.stroke();
      ctx.strokeStyle = CLAY; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(x0, 0);
    ctx.strokeStyle = OX; ctx.lineWidth = 7; ctx.stroke();
    ctx.strokeStyle = CLAY; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0, R);
    ctx.quadraticCurveTo(x0 + tipL * 0.6, R * 0.3, d, 0);
    ctx.quadraticCurveTo(x0 + tipL * 0.6, -R * 0.3, x0, -R);
    ctx.closePath(); ctx.fillStyle = OX; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(d - 1, 0);
    ctx.strokeStyle = CLAY; ctx.lineWidth = 1.2; ctx.stroke();
    for (let n = 0; n < 6; n++) {
      ctx.beginPath(); ctx.arc(SITE[n].r, 0, 2.6, 0, 6.2832);
      ctx.fillStyle = OX; ctx.fill();
    }
    ctx.restore();
  }

  // Letters swell from dots into upright, separated glyphs, each on the side opposite its side arm.
  ctx.font = '700 26px Georgia,serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = OX;
  for (let a = 0; a < 6; a++) {
    const th = Math.PI / 6 + a * Math.PI / 3, c = Math.cos(th), s2 = Math.sin(th);
    for (let n = 0; n < 6; n++) {
      const p = ease((t - 2.5 - 0.7 * n) / 2.2);
      if (p <= 0) continue;
      const off = -SITE[n].sg * 22, r = SITE[n].r;
      const x = r * c - off * s2, y = r * s2 + off * c, k = 0.35 + 0.65 * p;
      ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.globalAlpha = p;
      ctx.fillText(LET[n], 0, 0); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;

  // Small annotations at the edge only.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = OX; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = '600 15px Georgia,serif';
  ctx.fillText('Fixed-Lag Side Branches on a Dendrite Tip', 24, 34);
  ctx.font = '13px ui-monospace,Menlo,monospace';
  ctx.fillText('V ' + v.toFixed(1) + '   R ' + R.toFixed(1) + '   V*R^2 ' + (v * R * R).toFixed(0), 24, H - 24);
};

const resize = () => { cv.width = innerWidth; cv.height = innerHeight; };
addEventListener('resize', resize); resize();
let t = 0, last = -1;
drawFrame(0);
const tick = ms => {
  requestAnimationFrame(tick);
  if (last >= 0) t += Math.min((ms - last) / 1000, 0.5) * (RM.matches ? 0.2 : 1);
  last = ms;
  drawFrame(t);
};
requestAnimationFrame(tick);
</script>
</body></html>
