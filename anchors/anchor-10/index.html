<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Winfree Rotors</title>
<style>
html,body{margin:0;height:100%;background:#d9c9a8;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// lib/webgl2.js: fullscreen-triangle WebGL2 bootstrap, standard uniforms, ping-pong FBOs.

/** Prepended to fragment sources without #version. Write to `o`. */
export const GL_HEAD = `#version 300 es
precision highp float;precision highp int;precision highp sampler2D;
uniform float u_time,u_reduced;uniform vec2 u_res,u_mouse;uniform vec4 u_audio;out vec4 o;
`;
const GL_VS = '#version 300 es\nvoid main(){gl_Position=vec4(vec2(gl_VertexID&1,gl_VertexID>>1)*4.-1.,0,1);}';

/** Compiles and links; throws with the info log. */
export function glProgram(gl, frag, vert = GL_VS) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vert], [gl.FRAGMENT_SHADER, frag]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw Error('GLSL compile failed: ' + gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw Error('GLSL link failed: ' + gl.getProgramInfoLog(p));
  return p;
}

/** set(name, number | array) for active uniforms; unknown names are ignored. */
export function glSetter(gl, prog) {
  const fns = { [gl.FLOAT]: 'uniform1fv', [gl.FLOAT_VEC2]: 'uniform2fv', [gl.FLOAT_VEC3]: 'uniform3fv', [gl.FLOAT_VEC4]: 'uniform4fv', [gl.INT]: 'uniform1iv', [gl.SAMPLER_2D]: 'uniform1iv' };
  const u = {};
  for (let i = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS); i--;) {
    const a = gl.getActiveUniform(prog, i);
    u[a.name.replace('[0]', '')] = [gl.getUniformLocation(prog, a.name), fns[a.type]];
  }
  return (name, v) => { const x = u[name]; if (x && x[1]) gl[x[1]](x[0], typeof v === 'number' ? [v] : v); };
}

/** Draws the fullscreen triangle into fb (null = screen). */
export const glDraw = (gl, fb = null, w = gl.drawingBufferWidth, h = gl.drawingBufferHeight) => {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.viewport(0, 0, w, h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
};

/** Render loop: frame(st) runs first (extra passes, st.audio), then frag draws to screen. Reduced motion slows time to `reduce`. */
export function glStart(canvas, frag, { scale = 1, dprMax = 1, reduce = 0.2, frame } = {}) {
  const gl = canvas.getContext('webgl2', { antialias: false });
  if (!gl) throw Error('WebGL2 unavailable');
  const prog = glProgram(gl, frag.startsWith('#version') ? frag : GL_HEAD + frag);
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  const st = { kind: 'webgl2', gl, prog, set: glSetter(gl, prog), time: 0, reduced: false, mouse: [0.5, 0.5], audio: [0, 0, 0, 0], raf: 0 };
  canvas.addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    st.mouse = [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height];
  });
  let last = -1;
  const loop = (ms) => {
    st.raf = requestAnimationFrame(loop);
    const k = Math.min(devicePixelRatio, dprMax) * scale, w = Math.max(1, (canvas.clientWidth * k) | 0), h = Math.max(1, (canvas.clientHeight * k) | 0);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    st.reduced = mq.matches;
    st.time += last < 0 ? 0 : Math.min((ms - last) / 1000, 0.5) * (st.reduced ? reduce : 1);
    last = ms;
    if (frame) frame(st);
    gl.useProgram(prog);
    st.set('u_time', st.time); st.set('u_reduced', st.reduced ? 1 : 0); st.set('u_res', [w, h]);
    st.set('u_mouse', st.mouse); st.set('u_audio', st.audio);
    glDraw(gl);
  };
  st.raf = requestAnimationFrame(loop);
  st.stop = () => cancelAnimationFrame(st.raf);
  return st;
}

/** Targets pp.a (read) and pp.b (write), each { tex, fb }; RGBA16F when renderable, else RGBA8. */
export function createPingPong(gl, w, h) {
  const f = !!gl.getExtension('EXT_color_buffer_float');
  const mk = () => {
    const tex = gl.createTexture(), fb = gl.createFramebuffer();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, f ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, f ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.REPEAT], [gl.TEXTURE_WRAP_T, gl.REPEAT]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { tex, fb };
  };
  const pp = { w, h, float: f, a: mk(), b: mk(), swap: () => { [pp.a, pp.b] = [pp.b, pp.a]; } };
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return pp;
}

// ---- piece: Oregonator excitable medium in a petri dish ----
// Tyson-Fife Oregonator with a photo-induced bromide flux (phi):
//   eps du/dt = u - u^2 - (f v + phi)(u - q)/(u + q) + D lap(u)   u: HBrO2 (activator)
//       dv/dt = u - v                                             v: oxidised catalyst
// The fast bromide species is slaved: w = (f v + phi)/(q + u), kept for shading.
const N = 384, SPS = 180, CAP = 20;
const SIM = GL_HEAD + `
uniform sampler2D S;uniform float K,ts;uniform vec4 P0,P1,P2,E;uniform float Er;
const float N=384.,R=183.,EPS=.05,F=1.4,Q=.002,DT=.02,D=3.2;
float hs(vec2 p){p=fract(p*vec2(.1031,.103));p+=dot(p,p.yx+33.33);return fract((p.x+p.y)*p.x);}
float light(vec2 p){
  p*=256./N;vec2 d=p-128.;float a=.0065+.0015*sin(d.x*.06+d.y*.025+sin(d.y*.04)*1.5);
  float b=0.;
  b=max(b,1.-smoothstep(5.,7.,length(p-vec2(84,170))));
  b=max(b,1.-smoothstep(3.,5.,length(p-vec2(176,92))));
  b=max(b,1.-smoothstep(6.,8.,length(p-vec2(150,190))));
  b=max(b,1.-smoothstep(2.,4.,length(p-vec2(100,80))));
  return a+.25*b;}
vec4 nb(ivec2 c,vec4 me){vec2 d=vec2(c)+.5-N*.5;return dot(d,d)>R*R?me:texelFetch(S,c,0);}
float seg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;return length(pa-ba*clamp(dot(pa,ba)/max(dot(ba,ba),1e-4),0.,1.));}
void main(){
  ivec2 c=ivec2(gl_FragCoord.xy);vec2 p=vec2(c)+.5;float ph=light(p);
  if(K>0.){o=vec4(.0025,.011,ph,0.);return;}
  vec4 m=texelFetch(S,c,0);
  if(length(p-N*.5)>R){o=m;return;}
  float l=(4.*(nb(c+ivec2(1,0),m).x+nb(c-ivec2(1,0),m).x+nb(c+ivec2(0,1),m).x+nb(c-ivec2(0,1),m).x)
    +nb(c+ivec2(1,1),m).x+nb(c-ivec2(1,1),m).x+nb(c+ivec2(1,-1),m).x+nb(c-ivec2(1,-1),m).x-20.*m.x)/6.;
  float u=m.x+DT*D*l,v=m.y;
  for(int k=0;k<8;k++){float du=(u-u*u-(F*v+ph)*(u-Q)/(u+Q))/EPS;u=max(u+DT*.125*du,0.);v+=DT*.125*(u-v);}
  if(P0.z>0.&&length(p-P0.xy)<P0.z)u=.85;
  if(P1.z>0.&&length(p-P1.xy)<P1.z)u=.85;
  if(P2.z>0.&&length(p-P2.xy)<P2.z)u=.85;
  if(Er>0.&&seg(p,E.xy,E.zw)<Er){u=0.;v=max(v,.06);}
  o=vec4(u,v,ph,mix(m.w,v,.004));
}`;

const RENDER = `
uniform sampler2D S;
const float N=384.,R=183.;
float hs(vec2 p){p=fract(p*vec2(.1031,.103));p+=dot(p,p.yx+33.33);return fract((p.x+p.y)*p.x);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f*=f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+1.),f.x),f.y);}
vec3 film(float x){return .5+.5*cos(6.2832*(x+vec3(0.,.33,.67)));}
void main(){
  vec2 fc=gl_FragCoord.xy,ce=u_res*.5;float Rp=u_res.y*.455,t=u_time;
  vec2 q=(fc-ce)/Rp;float r=length(q);
  // light table: warm parchment, fibre, vignette
  float fib=vn(fc*vec2(.9,.06))*.5+vn(fc*.21)*.5;
  vec3 paper=vec3(.86,.79,.66)*(.93+.07*fib);
  vec2 vq=(fc-ce)/u_res;paper*=1.-.9*dot(vq,vq);
  float sh=smoothstep(1.13,.98,length(q-vec2(.035,-.05)));
  vec3 col=paper*(1.-.32*sh);
  // dish interior
  vec2 uv=(N*.5+q*R)/N;
  float e=1.6/N;
  vec4 s=texture(S,uv);
  float hx=texture(S,uv+vec2(e,0)).y-texture(S,uv-vec2(e,0)).y,hy=texture(S,uv+vec2(0,e)).y-texture(S,uv-vec2(0,e)).y;
  float ux=texture(S,uv+vec2(e,0)).x-texture(S,uv-vec2(e,0)).x,uy=texture(S,uv+vec2(0,e)).x-texture(S,uv-vec2(0,e)).x;
  vec3 n=normalize(vec3(-(hx*9.+ux*1.4),-(hy*9.+uy*1.4),1.));
  float u=s.x,v=s.y,V=smoothstep(.015,.16,v),Fr=smoothstep(.08,.55,u);
  float lt=smoothstep(14.,19.,t);
  float w=(1.4*v+s.z)/(.002+u);
  // reagent colours: reduced ferroin madder, oxidised Prussian indigo, verdigris lip, ivory front
  vec3 red=mix(vec3(.50,.22,.14),vec3(.86,.76,.60),lt);
  vec3 ox=mix(vec3(.12,.17,.33),vec3(.58,.30,.15),lt);
  vec3 ver=mix(vec3(.30,.52,.46),vec3(.36,.56,.48),lt);
  vec3 iv=vec3(.98,.93,.81);
  float stri=.06*(s.z-.0065)/.0015;
  vec3 liq=mix(red*(1.+stri),ox,V);
  float lip=smoothstep(.12,.0,abs(V-.22))*(1.-Fr);
  liq=mix(liq,ver,lip*.55);
  liq=mix(liq,iv,Fr*.9);
  float mem=smoothstep(.02,.09,s.w);
  liq*=mix(1.,.86,mem*(1.-lt));
  liq=mix(liq,liq*(.85+.3*film(V*.8+mem+t*.03)),.35*lt*smoothstep(.05,.5,V)*(1.-V*.5));
  float bar=smoothstep(.05,.2,s.z);
  liq=mix(liq,vec3(.80,.74,.62),bar*.8);
  // refraction of the table + meniscus depth + specular
  vec2 rq=fc+n.xy*24.;
  float tab=.9+.1*vn(rq*.05);
  liq*=tab*(.86+.14*n.z);
  vec3 L=normalize(vec3(-.5,.6,.65));
  float spc=pow(max(dot(reflect(-L,n),vec3(0,0,1)),0.),60.)*.55;
  float men=smoothstep(.86,1.,r);
  liq*=1.-.45*men*men;
  liq+=spc*vec3(1.,.96,.88);
  liq+=.06*vec3(1.,.95,.85)*(1.-r*r);
  float inside=smoothstep(1.0,.993,r);
  col=mix(col,liq,inside);
  // glass wall: bright rim + thin dark edge
  float rim=exp(-pow((r-1.012)/.008,2.));
  col=col*(1.-.35*exp(-pow((r-1.03)/.006,2.)))+rim*vec3(1.,.96,.86)*.55;
  col+=.05*smoothstep(1.06,1.,r)*smoothstep(.99,1.03,r);
  // lens vignette + grain
  col*=1.-.18*smoothstep(.5,1.4,length(vq*2.));
  col+=(hs(fc+fract(t)*91.)-.5)*.018;
  o=vec4(pow(max(col,0.),vec3(.95)),1);
}`;

const cv = document.getElementById('c');
let gl, sim, setS, pp, steps = 0, inited = 0, last = [0, 0, 0];
const pm = [[86, 132, 1.05, .3], [170, 166, 1.3, .7], [150, 70, 1.5, 1.1]];
const strokes = [[7.4, 7.7, 128, 128, 160, 150], [8.2, 8.5, 70, 100, 100, 82], [9, 9.3, 180, 90, 200, 125], [9.8, 10.1, 112, 200, 76, 186], [10.6, 10.9, 150, 60, 176, 40]];
let ptr = null;
const cell = (e) => {
  const r = cv.getBoundingClientRect(), h = r.height * .455;
  return [192 + (e.clientX - r.left - r.width / 2) / h * 183, 192 - (e.clientY - r.top - r.height / 2) / h * 183];
};
cv.addEventListener('pointerdown', (e) => { const c = cell(e); ptr = [...c, ...c]; });
cv.addEventListener('pointermove', (e) => { if (ptr && e.buttons) { const c = cell(e); ptr = [ptr[2], ptr[3], ...c]; } });
addEventListener('pointerup', () => { ptr = null; });

const st = glStart(cv, RENDER, {
  frame(st) {
    if (!sim) {
      gl = st.gl; sim = glProgram(gl, SIM); setS = glSetter(gl, sim); pp = createPingPong(gl, N, N);
    }
    gl.useProgram(sim);
    gl.activeTexture(gl.TEXTURE0);
    if (!inited) { gl.bindTexture(gl.TEXTURE_2D, pp.a.tex); setS('K', 1); glDraw(gl, pp.b.fb, N, N); pp.swap(); setS('K', 0); inited = 1; }
    const n = Math.min(CAP, Math.floor(st.time * SPS) - steps);
    for (let k = 0; k < n; k++) {
      const ts = ++steps / SPS;
      pm.forEach(([x, y, per, ph], i) => {
        const f = ts < 9.2 && ts > ph ? Math.floor((ts - ph) / per) + 1 : 0;
        setS('P' + i, [x * 1.5, y * 1.5, f !== last[i] ? 5 : 0, 0]); last[i] = f;
      });
      const s = strokes.find((s) => ts >= s[0] && ts < s[1]);
      if (ptr) { setS('E', ptr); setS('Er', 5); }
      else if (s) { setS('E', s.slice(2).map((v) => v * 1.5)); setS('Er', 4); }
      else setS('Er', 0);
      gl.bindTexture(gl.TEXTURE_2D, pp.a.tex);
      glDraw(gl, pp.b.fb, N, N);
      pp.swap();
    }
    gl.bindTexture(gl.TEXTURE_2D, pp.a.tex);
  },
});
</script>
</body>
