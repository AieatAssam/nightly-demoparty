<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Beam, Two Clocks</title>
<style>
html,body{margin:0;height:100%;background:#1f252b;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
</style>
</head>
<body>
<canvas id="c" aria-label="Two pendulums hanging from a sprung beam. Drag a bob to disturb it; press space to nudge the left pendulum."></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const mq = matchMedia('(prefers-reduced-motion: reduce)');

  // Model: two pendulums (length L, bob mass m) hanging from a beam of mass M held by a spring k and damper c.
  // Linearised: M X'' = -kX - cX' + m g (th1 + th2) - m L (E1 + E2);  th'' = -w^2 th - X''/L + E.
  // E is an escapement term that holds each swing near amplitude A, like a clock's driving weight.
  const G = 9.81, L = 0.8, m = 1, M = 2, K = 150, C = 15, MU = 1.5, A = 0.35;
  const w0 = Math.sqrt(G / L);
  const W = [w0 * 1.004, w0 * 0.996]; // the two clocks are not quite matched
  let X, V, th, om, hist, simT, sample;
  function reset() {
    X = 0; V = 0; th = [0.35, 0.25]; om = [0, 0.25 * w0 * 0.9];
    hist = []; simT = 0; sample = 0;
  }
  reset();

  let held = -1;
  const phase = (i) => Math.atan2(-om[i] / W[i], th[i]);
  function dphi() {
    let d = Math.abs(phase(0) - phase(1));
    return d > Math.PI ? 2 * Math.PI - d : d;
  }

  function step(dt) {
    const E = [0, 1].map((i) => (i === held ? 0 : MU * (1 - (th[i] ** 2 + (om[i] / W[i]) ** 2) / (A * A)) * om[i]));
    const Xa = (-K * X - C * V + m * G * (th[0] + th[1]) - m * L * (E[0] + E[1])) / M;
    for (let i = 0; i < 2; i++) {
      if (i === held) continue;
      om[i] += (-W[i] * W[i] * th[i] - Xa / L + E[i]) * dt;
      th[i] += om[i] * dt;
    }
    V += Xa * dt;
    X += V * dt;
    simT += dt;
  }

  // Layout (CSS pixels).
  let w = 0, h = 0, px = 1, cx = 0, beamY = 0, rod = 0;
  function layout() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = w / 2;
    beamY = h * 0.2;
    rod = Math.min(h * 0.44, w * 0.3);
    px = rod / L;
  }
  layout();
  addEventListener('resize', layout);

  const pivots = () => [cx - rod * 0.55 + X * px * 1.5, cx + rod * 0.55 + X * px * 1.5];
  const bob = (i) => {
    const p = pivots()[i];
    return [p + Math.sin(th[i]) * rod, beamY + 8 + Math.cos(th[i]) * rod];
  };

  function toLocal(e) {
    const r = cv.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  cv.addEventListener('pointerdown', (e) => {
    const [x, y] = toLocal(e);
    for (let i = 0; i < 2; i++) {
      const [bx, by] = bob(i);
      if (Math.hypot(x - bx, y - by) < 60) { held = i; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; }
    }
  });
  cv.addEventListener('pointermove', (e) => {
    if (held < 0) return;
    const [x, y] = toLocal(e);
    const p = pivots()[held];
    th[held] = Math.max(-0.8, Math.min(0.8, Math.atan2(x - p, Math.max(20, y - beamY - 8))));
    om[held] = 0;
  });
  const release = () => { held = -1; cv.style.cursor = 'grab'; };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { om[0] += 0.8; e.preventDefault(); }
    if (e.key === 'r') reset();
  });

  const INK = '#d4a03c', SLATE = '#5b6670', LINE = '#9aa4ad', DIM = '#7d8892', TEXT = '#c9d0d6';

  function spring(x0, x1, y) {
    ctx.beginPath();
    ctx.moveTo(x0, y);
    const n = 10;
    for (let i = 1; i < n; i++) ctx.lineTo(x0 + ((x1 - x0) * i) / n, y + (i % 2 ? -9 : 9));
    ctx.lineTo(x1, y);
    ctx.stroke();
  }

  function draw() {
    ctx.fillStyle = '#1f252b';
    ctx.fillRect(0, 0, w, h);

    const off = X * px * 1.5;
    const half = rod * 1.0;
    // Walls and springs holding the beam.
    ctx.fillStyle = '#2c343b';
    ctx.fillRect(cx - half - 90, beamY - 40, 24, 80);
    ctx.fillRect(cx + half + 66, beamY - 40, 24, 80);
    ctx.strokeStyle = DIM; ctx.lineWidth = 2;
    spring(cx - half - 66, cx - half + off, beamY);
    spring(cx + half + off, cx + half + 66, beamY);
    // Beam.
    ctx.fillStyle = SLATE;
    ctx.fillRect(cx - half + off, beamY - 8, half * 2, 16);

    // Swing range guides.
    const pv = pivots();
    ctx.strokeStyle = '#2f3840'; ctx.lineWidth = 1;
    for (const p of pv) {
      ctx.beginPath();
      ctx.arc(p, beamY + 8, rod, Math.PI / 2 - 0.5, Math.PI / 2 + 0.5);
      ctx.stroke();
    }

    for (let i = 0; i < 2; i++) {
      const [bx, by] = bob(i);
      ctx.strokeStyle = LINE; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(pv[i], beamY + 8); ctx.lineTo(bx, by); ctx.stroke();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(bx, by, 34, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#8c6420'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#1f252b';
      ctx.beginPath(); ctx.arc(pv[i], beamY + 8, 5, 0, Math.PI * 2); ctx.fill();
    }

    // Phase-difference chart along the bottom.
    const gx = w * 0.12, gw = w * 0.76, gy = h * 0.8, gh = h * 0.14;
    ctx.strokeStyle = '#3a444d'; ctx.lineWidth = 1;
    ctx.strokeRect(gx, gy, gw, gh);
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(gx, gy + gh / 2); ctx.lineTo(gx + gw, gy + gh / 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillStyle = DIM;
    ctx.textAlign = 'right';
    ctx.fillText('180°', gx - 8, gy + 5);
    ctx.fillText('0°', gx - 8, gy + gh + 4);
    ctx.textAlign = 'left';
    ctx.fillText('phase difference over the last 20 s', gx, gy + gh + 20);
    if (hist.length > 1) {
      const t1 = simT, t0 = t1 - 20;
      ctx.fillStyle = "rgba(212,160,60,0.28)";
      ctx.beginPath();
      ctx.moveTo(gx + ((hist[0][0] - t0) / 20) * gw, gy + gh);
      for (const [t, d] of hist) ctx.lineTo(gx + ((t - t0) / 20) * gw, gy + gh - (d / Math.PI) * gh);
      ctx.lineTo(gx + ((hist[hist.length - 1][0] - t0) / 20) * gw, gy + gh);
      ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 2;
      ctx.beginPath();
      hist.forEach(([t, d], j) => {
        const x = gx + ((t - t0) / 20) * gw, y = gy + gh - (d / Math.PI) * gh;
        j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.stroke();
    }

    const d = (dphi() * 180) / Math.PI;
    ctx.fillStyle = TEXT;
    ctx.font = '600 20px system-ui, sans-serif';
    ctx.fillText('Two clocks, one beam', 32, 44);
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillStyle = DIM;
    ctx.fillText('Huygens, 1665. Drag a bob to knock it out of step.', 32, 68);
    ctx.textAlign = 'right';
    ctx.fillStyle = TEXT;
    ctx.font = '600 18px system-ui, sans-serif';
    ctx.fillText(`Δφ ${d.toFixed(0).padStart(3, ' ')}°`, w - 32, 44);
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillStyle = DIM;
    ctx.fillText(d > 165 ? 'anti-phase: the beam goes still' : d < 30 ? 'in phase: the beam sways' : 'drifting', w - 32, 68);
    ctx.textAlign = 'left';
  }

  let last = -1, acc = 0;
  const DT = 1 / 240;
  function frame(ms) {
    requestAnimationFrame(frame);
    if (last >= 0) acc += Math.min((ms - last) / 1000, 0.1) * (mq.matches ? 0.1 : 1);
    last = ms;
    while (acc >= DT) {
      step(DT);
      acc -= DT;
      if (simT - sample >= 0.05) {
        sample = simT;
        hist.push([simT, dphi()]);
        while (hist.length && hist[0][0] < simT - 20) hist.shift();
      }
    }
    draw();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
