<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nodal Lines</title>
<style>html,body{margin:0;height:100%;background:#26282a;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('webgl2'),mq=matchMedia('(prefers-reduced-motion: reduce)');
const V='#version 300 es\nvoid main(){gl_Position=vec4(vec2(gl_VertexID&1,gl_VertexID>>1)*4.-1.,0,1);}';
const F=`#version 300 es
precision highp float;
uniform float T;uniform vec2 R;out vec4 o;
const float P=3.14159265;
const vec2 M[4]=vec2[](vec2(1,3),vec2(2,5),vec2(3,7),vec2(4,9));
float f(vec2 p,vec2 k,float s){
  return cos(k.x*P*p.x)*cos(k.y*P*p.y)+s*cos(k.y*P*p.x)*cos(k.x*P*p.y);
}
void main(){
  vec2 p=(gl_FragCoord.xy-.5*R)/R.y*2.3;
  float s=-1.+.6*sin(T*.9);
  int i=min(int(T/5.),3);
  float v=f(p,M[i],s);
  if(i<3)v=mix(v,f(p,M[i+1],s),smoothstep(4.,5.,mod(T,5.)));
  float w=fwidth(v);
  float l=1.-smoothstep(.07,.07+w*1.5,abs(v));
  vec3 col=mix(vec3(.27,.28,.29),vec3(.66,.64,.55),l);
  float e=max(abs(p.x),abs(p.y));
  col=e>1.?vec3(.15,.157,.165):e>.985?vec3(.36,.37,.38):col;
  o=vec4(col,1);
}`;
const p=g.createProgram();
for(const[t,s]of[[g.VERTEX_SHADER,V],[g.FRAGMENT_SHADER,F]]){const h=g.createShader(t);g.shaderSource(h,s);g.compileShader(h);g.attachShader(p,h)}
g.linkProgram(p);g.useProgram(p);
const uT=g.getUniformLocation(p,'T'),uR=g.getUniformLocation(p,'R');
let t=0,last=-1;
function loop(ms){
  requestAnimationFrame(loop);
  const w=c.clientWidth,h=c.clientHeight;
  if(c.width!==w||c.height!==h){c.width=w;c.height=h}
  if(last>=0)t+=Math.min((ms-last)/1e3,.5)*(mq.matches?.2:1);
  last=ms;
  g.viewport(0,0,w,h);g.uniform1f(uT,t);g.uniform2f(uR,w,h);g.drawArrays(g.TRIANGLES,0,3);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
