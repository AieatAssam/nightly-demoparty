<!doctype html>
<html lang="en">

<title>Breath at 3,400 Metres</title>
<style>

canvas{display:block;width:100vw;height:100vh}

<body>
<canvas id="c" role="img" aria-label="A spiral of monthly carbon dioxide readings from Mauna Loa, 1958 to 2024. Each turn is one year; distance from the centre is concentration."></canvas>
<script>
(() => {
  // Monthly mean CO2 at Mauna Loa, ppm (NOAA GML). Rows: [year, half (1 = Jan-Jun, 2 = Jul-Dec), six monthly values].
  const ROWS = [[1958,1,null,null,315.71,317.45,317.51,317.27],[1958,2,315.87,314.93,313.21,312.42,313.33,314.67],[1959,1,315.58,316.49,316.65,317.72,318.29,318.15],[1959,2,316.54,314.8,313.84,313.33,314.81,315.58],[1960,1,316.43,316.98,317.58,319.03,320.03,319.58],[1960,2,318.18,315.9,314.17,313.83,315.0,316.19],[1961,1,316.89,317.7,318.54,319.48,320.58,319.77],[1961,2,318.56,316.79,314.99,315.31,316.1,317.01],[1962,1,317.94,318.55,319.68,320.57,321.02,320.62],[1962,2,319.61,317.4,316.24,315.42,316.69,317.7],[1963,1,318.74,319.07,319.86,321.38,322.24,321.49],[1963,2,319.74,317.77,316.21,315.99,317.07,318.35],[1964,1,319.57,320.04,320.75,321.84,322.25,321.89],[1964,2,320.44,318.69,316.71,316.87,317.68,318.71],[1965,1,319.44,320.44,320.89,322.14,322.17,321.87],[1965,2,321.21,318.87,317.82,317.3,318.87,319.42],[1966,1,320.62,321.6,322.39,323.7,324.08,323.75],[1966,2,322.37,320.36,318.64,318.1,319.78,321.02],[1967,1,322.33,322.5,323.03,324.41,325.0,324.09],[1967,2,322.54,320.92,319.25,319.39,320.73,321.96],[1968,1,322.57,323.15,323.89,325.02,325.57,325.36],[1968,2,324.14,322.11,320.33,320.25,321.32,322.89],[1969,1,324.0,324.41,325.63,326.66,327.38,326.71],[1969,2,325.88,323.66,322.38,321.78,322.85,324.11],[1970,1,325.06,325.99,326.93,328.13,328.08,327.67],[1970,2,326.34,324.68,323.1,323.06,324.01,325.13],[1971,1,326.17,326.69,327.18,327.78,328.93,328.57],[1971,2,327.36,325.43,323.36,323.56,324.8,326.01],[1972,1,326.77,327.63,327.75,329.72,330.07,329.09],[1972,2,328.04,326.32,324.84,325.2,326.5,327.55],[1973,1,328.55,329.57,330.3,331.5,332.48,332.07],[1973,2,330.87,329.31,327.52,327.19,328.17,328.65],[1974,1,329.36,330.71,331.49,332.65,333.19,332.2],[1974,2,331.07,329.15,327.33,327.27,328.31,329.58],[1975,1,330.73,331.46,331.94,333.11,333.95,333.42],[1975,2,331.97,329.95,328.49,328.36,329.38,330.77],[1976,1,331.56,332.74,333.36,334.74,334.72,333.97],[1976,2,333.08,330.68,328.96,328.72,330.16,331.62],[1977,1,332.68,333.17,334.96,336.14,336.93,336.17],[1977,2,334.89,332.56,331.29,331.28,332.46,333.6],[1978,1,334.94,335.26,336.66,337.69,338.02,338.01],[1978,2,336.5,334.42,332.36,332.45,333.76,334.91],[1979,1,336.14,336.69,338.27,338.82,339.24,339.26],[1979,2,337.54,335.72,333.97,334.24,335.32,336.81],[1980,1,337.9,338.34,340.07,340.93,341.45,341.36],[1980,2,339.45,337.67,336.25,336.14,337.3,338.29],[1981,1,339.29,340.55,341.63,342.6,343.04,342.54],[1981,2,340.82,338.48,336.95,337.05,338.57,339.91],[1982,1,340.93,341.76,342.78,343.96,344.77,343.88],[1982,2,342.42,340.24,338.37,338.41,339.44,340.78],[1983,1,341.57,342.78,343.37,345.4,346.14,345.76],[1983,2,344.32,342.51,340.46,340.53,341.79,343.2],[1984,1,344.21,344.92,345.68,347.37,347.77,347.16],[1984,2,345.79,343.74,341.59,341.86,343.31,345.0],[1985,1,345.48,346.41,347.91,348.66,349.28,348.65],[1985,2,346.9,345.26,343.47,343.35,344.73,346.12],[1986,1,346.78,347.48,348.25,349.86,350.52,349.98],[1986,2,348.25,346.17,345.48,344.82,346.22,347.48],[1987,1,348.73,348.92,349.81,351.4,352.15,351.58],[1987,2,350.21,348.2,346.66,346.72,348.08,349.28],[1988,1,350.51,351.7,352.5,353.67,354.35,353.88],[1988,2,352.8,350.49,348.97,349.37,350.42,351.62],[1989,1,353.07,353.43,354.08,355.72,355.95,355.44],[1989,2,354.05,351.84,350.09,350.33,351.55,352.91],[1990,1,353.86,355.1,355.75,356.38,357.38,356.39],[1990,2,354.89,353.06,351.38,351.69,353.14,354.41],[1991,1,354.93,355.82,357.33,358.77,359.23,358.23],[1991,2,356.3,353.97,352.34,352.43,353.89,355.21],[1992,1,356.34,357.21,357.97,359.22,359.71,359.44],[1992,2,357.15,354.99,353.01,353.4,354.42,355.68],[1993,1,357.1,357.42,358.59,359.39,360.3,359.64],[1993,2,357.45,355.76,354.14,354.22,355.53,357.03],[1994,1,358.36,359.04,360.11,361.36,361.78,360.94],[1994,2,359.51,357.59,355.86,356.21,357.65,359.1],[1995,1,360.04,361.0,361.98,363.44,363.83,363.33],[1995,2,361.78,359.33,358.32,358.14,359.61,360.82],[1996,1,362.2,363.36,364.28,364.69,365.25,365.06],[1996,2,363.69,361.55,359.69,359.72,361.04,362.39],[1997,1,363.24,364.21,364.65,366.48,366.77,365.73],[1997,2,364.46,362.4,360.44,360.97,362.65,364.51],[1998,1,365.39,366.1,367.36,368.79,369.56,369.13],[1998,2,367.98,366.1,364.16,364.54,365.67,367.3],[1999,1,368.35,369.28,369.84,371.15,371.12,370.46],[1999,2,369.61,367.06,364.95,365.52,366.88,368.26],[2000,1,369.45,369.71,370.75,371.98,371.74,371.87],[2000,2,370.02,368.27,367.15,367.18,368.53,369.83],[2001,1,370.76,371.69,372.63,373.55,374.03,373.4],[2001,2,371.68,369.78,368.34,368.61,369.94,371.42],[2002,1,372.7,373.37,374.29,375.19,375.93,375.69],[2002,2,374.16,372.03,370.92,370.73,372.43,373.98],[2003,1,375.07,375.82,376.64,377.92,378.78,378.46],[2003,2,376.88,374.57,373.34,373.31,374.84,376.17],[2004,1,377.17,378.05,379.06,380.54,380.8,379.87],[2004,2,377.65,376.17,374.43,374.63,376.33,377.68],[2005,1,378.63,379.91,380.95,382.48,382.64,382.4],[2005,2,380.93,378.93,376.89,377.2,378.54,380.3],[2006,1,381.58,382.4,382.86,384.8,385.22,384.24],[2006,2,382.65,380.6,379.04,379.33,380.35,382.02],[2007,1,383.1,384.12,384.81,386.73,386.78,386.33],[2007,2,384.73,382.24,381.2,381.37,382.7,384.19],[2008,1,385.78,386.06,386.28,387.33,388.78,387.99],[2008,2,386.61,384.32,383.41,383.22,384.41,385.79],[2009,1,387.17,387.7,389.04,389.76,390.36,389.7],[2009,2,388.24,386.29,384.95,384.64,386.23,387.63],[2010,1,388.91,390.41,391.37,392.67,393.21,392.38],[2010,2,390.41,388.54,387.03,387.43,388.87,389.99],[2011,1,391.5,392.05,392.8,393.44,394.41,393.95],[2011,2,392.72,390.33,389.28,389.19,390.48,392.06],[2012,1,393.31,394.04,394.59,396.38,396.93,395.91],[2012,2,394.56,392.59,391.32,391.27,393.2,394.57],[2013,1,395.78,397.03,397.66,398.64,400.02,398.81],[2013,2,397.51,395.39,393.72,393.9,395.36,397.03],[2014,1,398.04,398.27,399.91,401.51,401.96,401.43],[2014,2,399.27,397.18,395.54,396.17,397.4,399.08],[2015,1,400.18,400.55,401.74,403.35,404.15,402.97],[2015,2,401.46,399.11,397.82,398.49,400.27,402.06],[2016,1,402.73,404.25,405.06,407.6,407.9,406.99],[2016,2,404.59,402.45,401.23,401.79,403.72,404.64],[2017,1,406.36,406.66,407.54,409.22,409.89,409.08],[2017,2,407.33,405.32,403.57,403.82,405.31,407.0],[2018,1,408.15,408.52,409.59,410.45,411.44,410.99],[2018,2,408.9,407.16,405.71,406.19,408.21,409.27],[2019,1,411.03,411.96,412.18,413.54,414.86,414.15],[2019,2,411.96,410.17,408.76,408.74,410.47,411.97],[2020,1,413.59,414.32,414.72,416.42,417.28,416.58],[2020,2,414.58,412.75,411.5,411.49,413.1,414.23],[2021,1,415.49,416.72,417.61,419.01,419.09,418.93],[2021,2,416.9,414.42,413.26,413.9,414.97,416.67],[2022,1,418.13,419.24,418.76,420.19,420.97,420.94],[2022,2,418.85,417.15,415.91,415.74,417.47,418.99],[2023,1,419.48,420.31,420.99,423.35,424.0,423.68],[2023,2,421.83,419.68,418.5,418.82,420.46,421.86],[2024,1,422.8,424.55,425.38,426.51,426.9,426.91],[2024,2,425.55,422.99,422.03,422.38,423.85,425.4]];

  const pts = []; // { y: year, m: 1..12, v: ppm }
  for (const [yr, half, ...vals] of ROWS) {
    vals.forEach((v, i) => { if (v !== null) pts.push({ y: yr, m: (half - 1) * 6 + i + 1, v }); });
  }
  const years = {};
  for (const p of pts) (years[p.y] ||= []).push(p);
  const stat = {};
  for (const y in years) {
    const vs = years[y].map((p) => p.v);
    stat[y] = { mean: vs.reduce((a, b) => a + b, 0) / vs.length, swing: Math.max(...vs) - Math.min(...vs) };
  }
  // Trend: centred 2x12-month moving average (the usual way to take the seasons out of a monthly series).
  pts.forEach((p, i) => {
    let sum = 0, wsum = 0;
    for (let j = -6; j <= 6; j++) {
      const q = pts[i + j];
      if (!q) continue;
      const w = Math.abs(j) === 6 ? 0.5 : 1;
      sum += q.v * w; wsum += w;
    }
    p.trend = sum / wsum;
  });
  // The first and last six months lack a full window: carry the same month's offset from the neighbouring year instead.
  const n = pts.length;
  for (let i = 0; i < 6; i++) pts[i].trend = pts[i].v - (pts[i + 12].v - pts[i + 12].trend);
  for (let i = n - 6; i < n; i++) pts[i].trend = pts[i].v - (pts[i - 12].v - pts[i - 12].trend);
  const Y0 = 1958, Y1 = 2024, SEASON_X = 3;

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const CREAM = '#f3ecdd', INK = '#2b2622', OCHRE = '#b7852f', RULE = '#ddd2bd', MUTE = '#8a8075';
  const SERIF = 'Georgia, "Times New Roman", serif';
  const SANS = 'system-ui, -apple-system, "Segoe UI", sans-serif';

  let W, H, cx, cy, R0, K;
  function layout() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const rMax = Math.min(H * 0.44, W * 0.27);
    cx = W * 0.63; cy = H * 0.515;
    R0 = rMax * 0.11;
    K = (rMax - R0) / (430 - 310);
  }
  layout();
  addEventListener('resize', layout);

  const rad = (v) => R0 + (v - 310) * K;
  const ang = (m) => -Math.PI / 2 + ((m - 0.5) / 12) * Math.PI * 2;
  const xy = (p) => { const r = rad(p.trend + (p.v - p.trend) * SEASON_X), a = ang(p.m); return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  const tOf = (p) => p.y + (p.m - 0.5) / 12;

  // Colour for a year: pale warm grey for 1958 deepening to ink for 2024.
  const mix = (a, b, t) => {
    const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
    const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
    return `rgb(${pa.map((c, i) => Math.round(c + (pb[i] - c) * t)).join(',')})`;
  };
  const yearColour = (y) => mix('#b9ae9f', INK, (y - Y0) / (Y1 - Y0));

  function grid() {
    ctx.strokeStyle = RULE; ctx.lineWidth = 1;
    for (let v = 320; v <= 420; v += 20) {
      ctx.beginPath(); ctx.arc(cx, cy, rad(v), 0, Math.PI * 2); ctx.stroke();
    }
    const rOut = rad(430) + 16;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `12px ${SERIF}`; ctx.fillStyle = MUTE;
    'JFMAMJJASOND'.split('').forEach((ch, i) => {
      const a = ang(i + 1);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * rad(316), cy + Math.sin(a) * rad(316));
      ctx.lineTo(cx + Math.cos(a) * (rOut - 10), cy + Math.sin(a) * (rOut - 10));
      ctx.stroke();
      ctx.fillText(ch, cx + Math.cos(a) * rOut, cy + Math.sin(a) * rOut);
    });
    ctx.textBaseline = 'alphabetic';
  }

  // Draw the spiral up to fractional time `head` (years), with an ochre wash on years near `focus`.
  function spiral(head, focus) {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (let y = Y0; y <= Y1; y++) {
      const list = years[y].filter((p) => tOf(p) <= head);
      if (!list.length) break;
      const prev = years[y - 1] && tOf(years[y - 1][years[y - 1].length - 1]) <= head ? years[y - 1][years[y - 1].length - 1] : null;
      ctx.beginPath();
      if (prev) ctx.moveTo(...xy(prev)); else ctx.moveTo(...xy(list[0]));
      for (const p of list) ctx.lineTo(...xy(p));
      const near = Math.max(0, 1 - Math.abs(y + 0.5 - focus) / 4);
      if (near > 0) {
        ctx.strokeStyle = `rgba(183,133,47,${0.45 * near})`;
        ctx.lineWidth = 14 * near;
        ctx.stroke();
      }
      ctx.strokeStyle = near > 0.75 ? OCHRE : yearColour(y);
      ctx.lineWidth = near > 0.75 ? 2.6 : 1.6;
      ctx.stroke();
    }
  }

  function ppmLabels() {
    ctx.font = `11px ${SANS}`; ctx.textAlign = 'center';
    for (let v = 320; v <= 420; v += 20) {
      const y = cy - rad(v);
      ctx.fillStyle = 'rgba(243,236,221,0.85)'; ctx.fillRect(cx - 15, y - 8, 30, 15);
      ctx.fillStyle = MUTE; ctx.fillText(`${v}`, cx, y + 4);
    }
    ctx.textAlign = 'left';
  }

  // Small chart: one year's months against that year's mean.
  function breathChart(y, x0, y0, w, h) {
    const st = stat[y], list = years[y];
    ctx.strokeStyle = RULE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0 + h / 2); ctx.lineTo(x0 + w, y0 + h / 2); ctx.stroke();
    const px = (m) => x0 + ((m - 1) / 11) * w;
    const py = (v) => y0 + h / 2 - ((v - st.mean) / 4.5) * (h / 2);
    ctx.fillStyle = 'rgba(183,133,47,0.28)';
    ctx.beginPath();
    ctx.moveTo(px(list[0].m), y0 + h / 2);
    for (const p of list) ctx.lineTo(px(p.m), py(p.v));
    ctx.lineTo(px(list[list.length - 1].m), y0 + h / 2);
    ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
    ctx.beginPath();
    list.forEach((p, i) => (i ? ctx.lineTo(px(p.m), py(p.v)) : ctx.moveTo(px(p.m), py(p.v))));
    ctx.stroke();
    ctx.fillStyle = MUTE; ctx.font = `11px ${SANS}`; ctx.textAlign = 'left';
    ctx.fillText('Jan', x0, y0 + h + 14);
    ctx.textAlign = 'right'; ctx.fillText('Dec', x0 + w, y0 + h + 14);
    ctx.fillText('+4.5', x0 - 6, y0 + 4); ctx.fillText('-4.5', x0 - 6, y0 + h + 2);
    ctx.textAlign = 'left';
  }

  function text(y) {
    const x = Math.max(32, W * 0.06);
    ctx.fillStyle = INK; ctx.textAlign = 'left';
    ctx.font = `30px ${SERIF}`;
    ctx.fillText('Breath at 3,400 metres', x, 68);
    ctx.fillStyle = MUTE; ctx.font = `14px ${SANS}`;
    ['Monthly mean carbon dioxide at Mauna Loa,', 'March 1958 to December 2024. One turn is one', 'year; distance from the centre is concentration.', 'The swing around each year\'s trend is drawn x3.']
      .forEach((l, i) => ctx.fillText(l, x, 98 + i * 20));

    const st = stat[y];
    ctx.fillStyle = INK; ctx.font = `64px ${SERIF}`;
    ctx.fillText(String(y), x, 250);
    ctx.font = `15px ${SANS}`;
    ctx.fillText(`${st.mean.toFixed(1)} ppm annual mean`, x, 280);
    ctx.fillStyle = OCHRE;
    ctx.fillText(`${st.swing.toFixed(1)} ppm between peak and trough`, x, 302);
    ctx.fillStyle = MUTE; ctx.font = `12px ${SANS}`;
    ctx.fillText('that year, against its own mean (ppm)', x, 338);
    breathChart(y, x + 30, 352, Math.min(260, W * 0.2), 110);

    ctx.fillStyle = MUTE; ctx.font = `12px ${SANS}`;
    ['Northern forests draw the air down from May to', 'September and release it through winter.', 'Data: NOAA Global Monitoring Laboratory.']
      .forEach((l, i) => ctx.fillText(l, x, H - 74 + i * 18));
  }

  // Story: 0.4 s to 16 s draws 1958 to 2024; afterwards an ochre focus glides back through the decades and returns.
  let t = 0, last = -1;
  function frame(ms) {
    requestAnimationFrame(frame);
    if (last >= 0) t += Math.min((ms - last) / 1000, 0.25) * (reduced ? 0.2 : 1);
    last = ms;
    const T_END = 16;
    let head, focus;
    if (reduced) {
      head = Y1 + 1;
      focus = Y1 + 0.5 - 66 * (0.5 - 0.5 * Math.cos(t * 0.25));
    } else {
      const u = Math.min(1, Math.max(0, (t - 0.4) / (T_END - 0.4)));
      const e = u < 0.5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u);
      head = Y0 + 0.3 + e * (Y1 + 1 - Y0 - 0.3);
      focus = t < T_END ? head - 0.5 : Y1 + 0.5 - 66 * (0.5 - 0.5 * Math.cos(((t - T_END) * Math.PI) / 7));
    }
    const fy = Math.min(Y1, Math.max(Y0 + 1, Math.floor(focus)));

    ctx.fillStyle = CREAM; ctx.fillRect(0, 0, W, H);
    grid();
    spiral(head, focus);
    ppmLabels();
    text(fy);
  }
  requestAnimationFrame(frame);
})();
</script>
