<style>

<body>
<canvas id="c"></canvas>
<canvas id="v"></canvas>
<script type="module">
// lib/webgl2.js: fullscreen-triangle WebGL2 bootstrap, standard uniforms, ping-pong FBOs.

/** Prepended to fragment sources without #version. Write to `o`. */
export const GL_HEAD = `#version 300 es
precision highp float;precision highp int;precision highp sampler2D;
uniform float u_time,u_reduced;uniform vec2 u_res,u_mouse;uniform vec4 u_audio;out vec4 o;
`;
const GL_VS = '#version 300 es\nvoid main(){gl_Position=vec4(vec2(gl_VertexID&1,gl_VertexID>>1)*4.-1.,0,1);}';

/** Compiles and links; throws with the info log. */
export function glProgram(gl, frag, vert = GL_VS) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vert], [gl.FRAGMENT_SHADER, frag]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw Error('GLSL compile failed: ' + gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw Error('GLSL link failed: ' + gl.getProgramInfoLog(p));
  return p;
}

/** set(name, number | array) for active uniforms; unknown names are ignored. */
export function glSetter(gl, prog) {
  const fns = { [gl.FLOAT]: 'uniform1fv', [gl.FLOAT_VEC2]: 'uniform2fv', [gl.FLOAT_VEC3]: 'uniform3fv', [gl.FLOAT_VEC4]: 'uniform4fv', [gl.INT]: 'uniform1iv', [gl.SAMPLER_2D]: 'uniform1iv' };
  const u = {};
  for (let i = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS); i--;) {
    const a = gl.getActiveUniform(prog, i);
    u[a.name.replace('[0]', '')] = [gl.getUniformLocation(prog, a.name), fns[a.type]];
  }
  return (name, v) => { const x = u[name]; if (x && x[1]) gl[x[1]](x[0], typeof v === 'number' ? [v] : v); };
}

/** Draws the fullscreen triangle into fb (null = screen). */
export const glDraw = (gl, fb = null, w = gl.drawingBufferWidth, h = gl.drawingBufferHeight) => {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.viewport(0, 0, w, h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
};

/** Render loop: frame(st) runs first (extra passes, st.audio), then frag draws to screen. Reduced motion slows time to `reduce`. */
export function glStart(canvas, frag, { scale = 1, dprMax = 1, reduce = 0.2, frame } = {}) {
  const gl = canvas.getContext('webgl2', { antialias: false });
  if (!gl) throw Error('WebGL2 unavailable');
  const prog = glProgram(gl, frag.startsWith('#version') ? frag : GL_HEAD + frag);
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  const st = { kind: 'webgl2', gl, prog, set: glSetter(gl, prog), time: 0, reduced: false, mouse: [0.5, 0.5], audio: [0, 0, 0, 0], raf: 0 };
  canvas.addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    st.mouse = [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height];
  });
  let last = -1;
  const loop = (ms) => {
    st.raf = requestAnimationFrame(loop);
    const k = Math.min(devicePixelRatio, dprMax) * scale, w = Math.max(1, (canvas.clientWidth * k) | 0), h = Math.max(1, (canvas.clientHeight * k) | 0);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    st.reduced = mq.matches;
    st.time += last < 0 ? 0 : Math.min((ms - last) / 1000, 0.5) * (st.reduced ? reduce : 1);
    last = ms;
    if (frame) frame(st);
    gl.useProgram(prog);
    st.set('u_time', st.time); st.set('u_reduced', st.reduced ? 1 : 0); st.set('u_res', [w, h]);
    st.set('u_mouse', st.mouse); st.set('u_audio', st.audio);
    glDraw(gl);
  };
  st.raf = requestAnimationFrame(loop);
  st.stop = () => cancelAnimationFrame(st.raf);
  return st;
}

/** Targets pp.a (read) and pp.b (write), each { tex, fb }; RGBA16F when renderable, else RGBA8. */
export function createPingPong(gl, w, h) {
  const f = !!gl.getExtension('EXT_color_buffer_float');
  const mk = () => {
    const tex = gl.createTexture(), fb = gl.createFramebuffer();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, f ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, f ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.REPEAT], [gl.TEXTURE_WRAP_T, gl.REPEAT]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { tex, fb };
  };
  const pp = { w, h, float: f, a: mk(), b: mk(), swap: () => { [pp.a, pp.b] = [pp.b, pp.a]; } };
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return pp;
}
// lib/synth.js: gesture-gated WebAudio synth. One play(ctx, out, t0, t1, base) drives both live
// playback (startSynth) and the gate's offline probe (registerAudioProbe).

const srng = (a) => () => {
  a = (a + 0x6d2b79f5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
export const mtof = (m) => 440 * 2 ** ((m - 69) / 12);

/** input -> dry + ping-pong delay -> compressor -> tanh limiter (peak <= 0.87) -> analyser -> out. */
export function synthBus(ctx, { delay = 0.3, feedback = 0.35, wet = 0.25 } = {}) {
  const gain = (v) => { const n = ctx.createGain(); n.gain.value = v; return n; };
  const input = gain(1), sum = gain(1), w = gain(wet), fb = gain(feedback), dl = ctx.createDelay(2), dr = ctx.createDelay(2), mg = ctx.createChannelMerger(2);
  const comp = ctx.createDynamicsCompressor(), lim = ctx.createWaveShaper(), an = ctx.createAnalyser(), curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) curve[i] = 0.9 * Math.tanh(2 * (i / 511.5 - 1));
  lim.curve = curve; // oversample 'none': resampling could overshoot
  comp.threshold.value = -18; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
  dl.delayTime.value = dr.delayTime.value = delay;
  input.connect(sum); input.connect(w).connect(dl).connect(dr).connect(fb).connect(dl);
  dl.connect(mg, 0, 0); dr.connect(mg, 0, 1); mg.connect(sum);
  sum.connect(comp).connect(lim).connect(an).connect(ctx.destination);
  an.fftSize = 1024;
  const fd = new Uint8Array(an.frequencyBinCount), td = new Float32Array(an.fftSize), sm = { bass: 0, mid: 0, high: 0, rms: 0 };
  let last = 0;
  const avg = (a, b) => {
    const hz = ctx.sampleRate / an.fftSize, i = Math.round(a / hz), j = Math.max(i + 1, Math.round(b / hz));
    let s = 0;
    for (let k = i; k < j; k++) s += fd[k];
    return s / (j - i) / 255;
  };
  const bands = () => {
    an.getByteFrequencyData(fd); an.getFloatTimeDomainData(td);
    let r = 0;
    for (const x of td) r += x * x;
    const v = { bass: avg(20, 250), mid: avg(250, 2000), high: avg(2000, 10000), rms: Math.min(1, Math.sqrt(r / td.length) * 2) };
    const dt = Math.max(0, ctx.currentTime - last);
    last = ctx.currentTime;
    for (const k in sm) sm[k] = v[k] + (sm[k] - v[k]) * Math.exp(-dt / (v[k] > sm[k] ? 0.05 : 0.25));
    return { ...sm };
  };
  return { input, analyser: an, bands };
}

const env = (ctx, t, a, d, peak) => {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(1e-4, t + a + d);
  return g;
};

/** FM voice; modulation index decays over dur. */
export function fm(ctx, out, t, f, dur = 0.4, { ratio = 2, index = 3, vol = 0.3 } = {}) {
  const c = ctx.createOscillator(), m = ctx.createOscillator(), mg = ctx.createGain(), g = env(ctx, t, 0.005, dur, vol);
  c.frequency.value = f; m.frequency.value = f * ratio;
  mg.gain.setValueAtTime(f * index, t); mg.gain.exponentialRampToValueAtTime(f * index * 0.05 + 1e-3, t + dur);
  m.connect(mg).connect(c.frequency); c.connect(g).connect(out);
  for (const o of [c, m]) { o.start(t); o.stop(t + dur + 0.05); }
}

/** Subtractive voice: lowpass sweeps from cutoff down to f. */
export function sub(ctx, out, t, f, dur = 0.3, { cutoff = 1800, q = 6, vol = 0.25, type = 'sawtooth' } = {}) {
  const o = ctx.createOscillator(), bq = ctx.createBiquadFilter(), g = env(ctx, t, 0.005, dur, vol);
  o.type = type; o.frequency.value = f; bq.type = 'lowpass'; bq.Q.value = q;
  bq.frequency.setValueAtTime(cutoff, t); bq.frequency.exponentialRampToValueAtTime(Math.max(60, f), t + dur);
  o.connect(bq).connect(g).connect(out);
  o.start(t); o.stop(t + dur + 0.05);
}

/** Karplus-Strong samples from a seeded noise burst. */
export function ksBuffer(sr, f, dur = 1, seed = 1, damp = 0.996) {
  const n = Math.max(2, Math.round(sr / f)), d = new Float32Array(Math.ceil(sr * dur)), r = srng(seed);
  for (let i = 0; i < n && i < d.length; i++) d[i] = r() * 2 - 1;
  for (let i = n; i < d.length; i++) d[i] = damp * 0.5 * (d[i - n] + d[i - n + 1]);
  return d;
}

/** Plucked string voice. */
export function pluck(ctx, out, t, f, dur = 1, { vol = 0.4, seed = 1, damp = 0.996 } = {}) {
  const b = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate), s = ctx.createBufferSource(), g = ctx.createGain();
  b.copyToChannel(ksBuffer(ctx.sampleRate, f, dur, seed, damp), 0);
  s.buffer = b; g.gain.value = vol;
  s.connect(g).connect(out); s.start(t);
}

/** Step sequencer -> play(). step() runs once per step in [t0, t1) with a per-step seeded rnd. */
export const seq = ({ bpm = 120, div = 4, seed = 1 } = {}, step) => (ctx, out, t0, t1, base = 0) => {
  const dt = 60 / bpm / div;
  for (let i = Math.max(0, Math.ceil(t0 / dt - 1e-9)); i * dt < t1; i++) step(ctx, out, base + i * dt, i, srng(seed ^ Math.imul(i + 1, 0x9e3779b1)));
};

/** Live playback from the first pointerdown/keydown on target; nothing exists before it. */
export function startSynth(play, { target = document, ahead = 0.2, bus } = {}) {
  const h = { ctx: null, bus: null, bands: () => ({ bass: 0, mid: 0, high: 0, rms: 0 }) };
  const go = () => {
    if (h.ctx) return void h.ctx.resume();
    const ctx = (h.ctx = new AudioContext()), b = (h.bus = synthBus(ctx, bus)), base = ctx.currentTime + 0.05;
    let done = 0;
    h.bands = b.bands;
    const tick = () => { const t1 = ctx.currentTime - base + ahead; if (t1 > done) { play(ctx, b.input, done, t1, base); done = t1; } };
    tick();
    setInterval(tick, 50);
  };
  for (const e of ['pointerdown', 'keydown']) target.addEventListener(e, go);
  return h;
}

/** window.__demopartyAudioProbe: play() over the whole offline context from t = 0. */
export const registerAudioProbe = (play, bus) => {
  window.__demopartyAudioProbe = async (ctx) => play(ctx, synthBus(ctx, bus).input, 0, ctx.length / ctx.sampleRate, 0);
};

// ---- piece: the TRAPPIST-1 Laplace chain, seen and heard ----
// Orbital frequencies b..h are in the ratio 24:15:9:6:4:3:2 (Agol et al. 2021 periods give 24.8:15.5:9.3:6.2:4.1:3.0:2).
// Each planet sounds its own ratio times F0 when it transits the star; neighbours ring a dyad at conjunction.
const K = [24, 15, 9, 6, 4, 3, 2];
const A = [.01154, .0158, .02227, .02925, .03849, .04683, .06189].map((a) => a / .06189); // semi-major axes, h = 1
const RE = [1.116, 1.097, .788, .92, 1.045, 1.129, .755]; // radii, Earth = 1
const NM = 'bcdefgh', WAKE = [0, 0, 5, 6.2, 7.4, 8.6, 9.8];
const U = 1 / 16, TS = 12.5, DL = .15, AZ = .02, F0 = 27.5, TAU = Math.PI * 2;
const sm = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
const mix = (a, b, x) => a + (b - a) * x;
const awake = (i, t) => sm(WAKE[i], WAKE[i] + 1.4, t);
const lam = (i, t) => TAU * K[i] * U * (t - TS) + i * DL + AZ * t;
const fr = (x) => x - Math.floor(x);
// events where rate*t + c is an integer, t in [t0, t1)
const each = (rate, c, t0, t1, f) => { for (let n = Math.ceil(rate * t0 + c - 1e-9); ; n++) { const t = (n - c) / rate; if (t >= t1) break; f(t, n); } };

// ---- sound ----
const pad = (ctx, out, t, f, dur, vol) => {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * .35); g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur + .05);
};
const play = (ctx, out, t0, t1, base) => {
  each(.25, 0, t0, t1, (t) => { pad(ctx, out, base + t, F0 * 2, 6, .07); pad(ctx, out, base + t + 2, F0 * 3, 6, .035); });
  K.forEach((k, i) => {
    const rate = k * U + AZ / TAU, c = -k * U * TS + i * DL / TAU - .75; // transit: planet crosses the near side of the star
    each(rate, c, t0, t1, (t) => {
      const w = awake(i, t);
      if (w > .01) fm(ctx, out, base + t, F0 * k, .5 + 2.2 / Math.sqrt(k), { ratio: 2, index: .9, vol: w * (.05 + .05 / Math.sqrt(k)) });
    });
    if (i < 6) {
      const r = (k - K[i + 1]) * U;
      each(r, -r * TS - DL / TAU, t0, t1, (t) => {
        const w = awake(i + 1, t);
        if (w > .01) for (const j of [i, i + 1]) fm(ctx, out, base + t, F0 * K[j], 1.6, { ratio: 1, index: .4, vol: .05 * w });
      });
    }
  });
  if (TS >= t0 && TS < t1) K.forEach((k, i) => fm(ctx, out, base + TS + i * .06, F0 * k, 5, { ratio: 1, index: .3, vol: .045 }));
};
registerAudioProbe(play);
let off = null;
for (const e of ['pointerdown', 'keydown']) document.addEventListener(e, () => { if (off === null) off = st.time; });
const snd = startSynth((ctx, out, t0, t1, base) => play(ctx, out, t0 + off, t1 + off, base - off));

// ---- star, planets, tidal rings ----
const FS = `
uniform vec4 PL[7],LT[7],RG[6],SR;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f*=f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+1.),f.x),f.y);}
void main(){
  vec2 p=gl_FragCoord.xy,S=SR.xy,d=p-S;float R=SR.z,cy=SR.w,r=length(d),t=u_time;
  vec2 uv=(p-.5*u_res)/u_res.y;
  vec3 col=mix(vec3(.016,.0045,.005),vec3(.004,.0015,.002),smoothstep(.0,.95,length(uv)));
  col*=.9+.1*vn(p*.012+3.)+.05*vn(p*.08);
  float re=length(d/vec2(1.,cy));
  col+=vec3(.5,.13,.06)*.04*exp(-re/(R*14.))*(.6+.4*vn(vec2(atan(d.y/cy,d.x)*6.,re*.02)));
  float aud=u_audio.w;
  col+=vec3(1.,.2,.06)*R*R/(r*r+R*R*.3)*(.08+.08*aud)+vec3(1.,.36,.12)*exp(-max(r-R,0.)/(R*.25))*.25;
  for(int i=0;i<6;i++){vec4 g=RG[i];col+=vec3(1.,.6,.3)*g.y*exp(-pow((re-g.x)/(1.+g.x*.01),2.));}
  if(r<R+1.){
    vec2 q=d/R;float mu=sqrt(max(1.-dot(q,q),0.));
    vec2 sq=q/(.35+.65*mu);
    float gr=vn(sq*7.+t*.25)*.55+vn(sq*19.-t*.4)*.3+vn(sq*41.)*.15;
    float spot=smoothstep(.6,.8,vn(sq*2.6+vec2(t*.04,0.)+7.));
    vec3 sc=mix(vec3(.3,.018,.01),vec3(1.,.3,.07),pow(mu,.8))*(.25+.75*mu)*(.75+.5*gr)*(1.-.3*spot);
    col=mix(col,sc*(1.05+.3*aud),smoothstep(R+.5,R-1.,r));
  }
  for(int i=0;i<7;i++){vec4 P=PL[i];if(P.w<.01)continue;
    vec2 q=(p-P.xy)/P.z;float qq=dot(q,q);
    float vis=LT[i].w<0.?smoothstep(R-.5,R+1.5,r):1.;
    vec3 n=vec3(q,sqrt(max(1.-qq,0.)));float l=max(dot(n,LT[i].xyz),0.);
    vec3 pc=vec3(.9,.82,.7)*vec3(1.,.62,.4)*l*1.5+vec3(.05,.015,.014)+vec3(.5,.12,.06)*pow(1.-n.z,3.)*.4;
    col=mix(col,pc,P.w*vis*smoothstep(1.,.8,qq));
    col+=vec3(1.,.6,.4)*.05*P.w*vis*exp(-qq*.25)*(1.-step(qq,1.));
  }
  col=1.-exp(-col*1.25);
  col*=1.-.25*dot(uv,uv);
  o=vec4(pow(max(col,0.),vec3(.4545))+(h21(p+fract(t*5.)*77.*(1.-u_reduced))-.5)*.014,1);
}`;

const ov = document.getElementById('v'), g2 = ov.getContext('2d');
const PAIRS = [[0, 1, .55, 0], [1, 2, .5, 0], [2, 3, .45, 0], [3, 4, .4, 0], [4, 5, .4, 0], [5, 6, .4, 0], [2, 6, .5, 1], [1, 6, .38, 1]];
const INK = ['184,105,61', '201,164,92'], BONE = '232,223,204';
const st = glStart(document.getElementById('c'), FS, {
  frame(st) {
    const t = st.time, W = innerWidth, H = innerHeight;
    if (ov.width !== W || ov.height !== H) { ov.width = W; ov.height = H; }
    const b = snd.bands(); st.audio = [b.bass, b.mid, b.high, b.rms];
    // camera: close on b and c, open out as the chain wakes, then pull back face-on to the mandala
    const z1 = sm(2.5, 10.5, t), z2 = sm(14.5, 19.8, t);
    const sc = Math.exp(mix(mix(Math.log(1150), Math.log(560), z1), Math.log(320), z2)) * H / 720;
    const ti = mix(mix(1.15, 1.05, z1), .12, z2), ct = Math.cos(ti), stt = Math.sin(ti);
    const cx = W / 2, cy = H / 2 + mix(H * .04, 0, z2);
    const pos = (i, tt) => { const l = lam(i, tt), r = A[i] * sc; return [cx + r * Math.cos(l), cy - r * Math.sin(l) * ct]; };
    const Rs = .045 * sc;
    // uniforms for the shader (GL y is up)
    const PL = [], LT = [], RG = [];
    for (let i = 0; i < 7; i++) {
      const l = lam(i, t), X = Math.cos(l), Y = Math.sin(l), [x, y] = pos(i, t);
      PL.push(x, H - y, Math.max(2.2, RE[i] * sc * .0085), awake(i, t));
      LT.push(-X, -Y * ct, Y * stt, -Y);
    }
    for (let i = 0; i < 6; i++) {
      const r = (K[i] - K[i + 1]) * U, ds = fr(r * t - r * TS - DL / TAU) / r, w = awake(i + 1, t);
      RG.push(Rs + ds * .32 * sc, .22 * Math.exp(-ds * 1.3) * w * (1 + 2 * Math.exp(-Math.abs(t - TS - .3))), 0, 0);
    }
    st.set('PL', PL); st.set('LT', LT); st.set('RG', RG); st.set('SR', [cx, H - cy, Rs, ct]);
    // engraving layer
    g2.clearRect(0, 0, W, H);
    g2.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      g2.strokeStyle = `rgba(${BONE},${.13 * awake(i, t)})`; g2.lineWidth = 1;
      g2.beginPath(); g2.ellipse(cx, cy, A[i] * sc, A[i] * sc * ct, 0, 0, TAU); g2.stroke();
    }
    // ticks on the outer orbit, one per degree of the 16 s super-period's 24 b-orbits
    g2.strokeStyle = `rgba(${BONE},${.22 * awake(6, t)})`; g2.beginPath();
    for (let k = 0; k < 72; k++) {
      const a = k / 72 * TAU, r0 = sc * 1.02, r1 = sc * (k % 6 ? 1.035 : 1.06);
      g2.moveTo(cx + r0 * Math.cos(a), cy - r0 * Math.sin(a) * ct); g2.lineTo(cx + r1 * Math.cos(a), cy - r1 * Math.sin(a) * ct);
    }
    g2.stroke();
    // roses: chords between two planets sampled back through time
    const Wn = mix(2.6, 16, sm(9, 19.5, t)), lng = sm(14.5, 18.5, t);
    g2.lineWidth = .7;
    for (const [i, j, a0, kind] of PAIRS) {
      const a = a0 * awake(i, t) * awake(j, t) * (kind ? lng : mix(1, .55, lng)) * (st.reduced ? .3 : 1);
      if (a < .01) continue;
      const N = kind ? 420 : 210;
      for (let bk = 0; bk < 6; bk++) {
        g2.strokeStyle = `rgba(${INK[kind]},${a * Math.pow(1 - bk / 6, kind ? .5 : 1.6)})`; g2.beginPath();
        for (let k = bk * N / 6; k < (bk + 1) * N / 6; k++) {
          const tk = t - k * Wn / N, p = pos(i, tk), q = pos(j, tk);
          g2.moveTo(p[0], p[1]); g2.lineTo(q[0], q[1]);
        }
        g2.stroke();
      }
    }
    // conjunction chords: a gold ray from the star through both planets and an arc on the outer orbit
    for (let i = 0; i < 6; i++) {
      const r = (K[i] - K[i + 1]) * U, ds = fr(r * t - r * TS - DL / TAU) / r;
      const I = Math.exp(-ds / .45) * awake(i + 1, t);
      if (I < .02) continue;
      const l = lam(i + 1, t), ro = A[i + 1] * sc;
      g2.strokeStyle = `rgba(222,178,96,${.85 * I})`; g2.lineWidth = 1.4;
      g2.beginPath(); g2.moveTo(cx + Rs * 1.3 * Math.cos(l), cy - Rs * 1.3 * Math.sin(l) * ct);
      g2.lineTo(cx + ro * 1.08 * Math.cos(l), cy - ro * 1.08 * Math.sin(l) * ct); g2.stroke();
      g2.beginPath();
      for (let k = -12; k <= 12; k++) { const a = l + k * .02 * (1 + ds * 3); g2[k > -12 ? 'lineTo' : 'moveTo'](cx + ro * Math.cos(a), cy - ro * Math.sin(a) * ct); }
      g2.stroke();
    }
    // names and the legend
    g2.font = 'italic 13px Georgia,serif'; g2.textBaseline = 'middle';
    for (let i = 0; i < 7; i++) {
      const [x, y] = pos(i, t), pr = Math.max(2.2, RE[i] * sc * .0085);
      g2.fillStyle = `rgba(${BONE},${.55 * awake(i, t)})`; g2.fillText(NM[i], x + pr + 5, y - pr - 5);
    }
    g2.font = '12px Georgia,serif'; g2.fillStyle = `rgba(${BONE},.5)`;
    g2.fillText('TRAPPIST-1   b c d e f g h   24 : 15 : 9 : 6 : 4 : 3 : 2', 28, H - 30);
    if (off === null) { g2.fillStyle = `rgba(${BONE},${.4 * (1 - sm(8, 12, t)) + .12})`; g2.fillText('press or tap for sound', 28, H - 50); }
  },
});
</script>
