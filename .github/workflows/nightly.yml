name: Nightly Demoparty

# One night: plan, research, feel, brief, then up to 3 build attempts each gated and judged, then publish.
# Only the publish job can write to the repo or Pages, and it only reads artifacts of jobs that succeeded.
# Job timeouts sum to 79 minutes worst-case, with 45 for build_and_judge (SPEC Section 5; see DECISIONS.md, M6C). Inside
# build_and_judge an attempt only starts when its worst case still fits the job timeout, so a slow night stops cleanly.
on:
  # Uncomment after first workflow_dispatch dry run (see SETUP.md):
  # schedule:
  #   - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      force_domain:
        description: Domain id from config/domains.yml (empty for the planner's pick)
        type: string
        default: ''
      force_compo:
        description: Compo id from config/compos.yml (empty for the rotation)
        type: string
        default: ''
      force_mood_preset:
        description: Mood preset name (skips the appraisal call)
        type: string
        default: ''
      dry_run:
        description: Run every stage but publish nothing (no commit, no deploy; the audit is uploaded)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  DRY_RUN: ${{ inputs.dry_run == true }}
  # Claude Code strips credentials (the OAuth token) from the environment of every subprocess an agent starts.
  CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      date: ${{ steps.night.outputs.date }}
      night: ${{ steps.night.outputs.night }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: "Night folder"
        id: night
        run: |
          set -euo pipefail
          date=$(date -u +%F)
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "night=audit/$date" >> "$GITHUB_OUTPUT"
          echo "NIGHT=audit/$date" >> "$GITHUB_ENV"
      - name: "Init"
        run: node --import tsx harness/dry-run.ts step init --night "$NIGHT"
      - name: "Stage 0: plan"
        env:
          NIGHT_DATE: ${{ steps.night.outputs.date }}
          FORCE_DOMAIN: ${{ inputs.force_domain }}
          FORCE_COMPO: ${{ inputs.force_compo }}
          FORCE_MOOD_PRESET: ${{ inputs.force_mood_preset }}
        run: |
          set -euo pipefail
          args=(plan --date "$NIGHT_DATE" --out "$NIGHT/plan.json")
          if [ -n "$FORCE_DOMAIN" ]; then args+=(--domain "$FORCE_DOMAIN"); fi
          if [ -n "$FORCE_COMPO" ]; then args+=(--compo "$FORCE_COMPO"); fi
          if [ -n "$FORCE_MOOD_PRESET" ]; then args+=(--mood-preset "$FORCE_MOOD_PRESET"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node --import tsx harness/cli.ts "${args[@]}" > /dev/null
          jq -c '{date, compo, domain, wildcard, dry_run}' "$NIGHT/plan.json"
      - name: Upload night (plan)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: night-plan
          path: ${{ env.NIGHT }}/
          retention-days: 7
          if-no-files-found: ignore

  research:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NIGHT: ${{ needs.plan.outputs.night }}
    outputs:
      halted: ${{ steps.halt.outputs.halted }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download night (plan)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: night-plan
          path: ${{ env.NIGHT }}
      - name: "Render research prompt (try 1)"
        id: render1
        run: node --import tsx harness/dry-run.ts step render-research --night "$NIGHT" --try 1
      - name: "Stage 1: research (try 1)"
        id: research1
        timeout-minutes: 3
        continue-on-error: true
        uses: ./.github/actions/agent
        with:
          stage: research
          model: haiku
          max_turns: '15'
          tools: WebSearch,WebFetch,Write
          prompt_file: ${{ steps.render1.outputs.prompt_file }}
          allowed_write_paths: ${{ env.NIGHT }}/dossier.json
          run_id: ${{ github.run_id }}-${{ github.run_attempt }}
          date: ${{ needs.plan.outputs.date }}
          attempt: '1'
          usage_file: ${{ env.NIGHT }}/usage/research.jsonl
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: "Guard after a cut-off call: Stage 1: research (try 1)"
        if: always() && steps.research1.outcome == 'failure'
        env:
          GUARD_FILE: ${{ runner.temp }}/guard-research-1.snap
          ALLOWED: ${{ env.NIGHT }}/dossier.json
        run: bash "$RUNNER_TEMP/agent-guard.sh" check "$GUARD_FILE" "$ALLOWED"
      - name: "Validate dossier (try 1)"
        id: check1
        run: |
          if node --import tsx harness/cli.ts validate dossier "$NIGHT/dossier.json" --plan "$NIGHT/plan.json" > "$NIGHT/research-check-1.json"; then ok=true; else ok=false; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          jq -c . "$NIGHT/research-check-1.json" || true
      - name: "Render research prompt (try 2)"
        id: render2
        if: steps.check1.outputs.ok != 'true'
        run: node --import tsx harness/dry-run.ts step render-research --night "$NIGHT" --try 2
      - name: "Stage 1: research (try 2)"
        id: research2
        if: steps.check1.outputs.ok != 'true'
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/agent
        with:
          stage: research
          model: haiku
          max_turns: '15'
          tools: WebSearch,WebFetch,Write
          prompt_file: ${{ steps.render2.outputs.prompt_file }}
          allowed_write_paths: ${{ env.NIGHT }}/dossier.json
          run_id: ${{ github.run_id }}-${{ github.run_attempt }}
          date: ${{ needs.plan.outputs.date }}
          attempt: '2'
          usage_file: ${{ env.NIGHT }}/usage/research.jsonl
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: "Guard after a cut-off call: Stage 1: research (try 2)"
        if: always() && steps.research2.outcome == 'failure'
        env:
          GUARD_FILE: ${{ runner.temp }}/guard-research-2.snap
          ALLOWED: ${{ env.NIGHT }}/dossier.json
        run: bash "$RUNNER_TEMP/agent-guard.sh" check "$GUARD_FILE" "$ALLOWED"
      - name: "Validate dossier (try 2)"
        id: check2
        if: steps.check1.outputs.ok != 'true'
        run: |
          if node --import tsx harness/cli.ts validate dossier "$NIGHT/dossier.json" --plan "$NIGHT/plan.json" > "$NIGHT/research-check-2.json"; then ok=true; else ok=false; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          jq -c . "$NIGHT/research-check-2.json" || true
      - name: "Halt if both dossiers failed"
        id: halt
        if: steps.check1.outputs.ok != 'true' && steps.check2.outputs.ok != 'true'
        run: node --import tsx harness/dry-run.ts step halt --night "$NIGHT" --stage research --reason "the dossier failed validation twice"
      - name: Reject symlinks (research)
        if: always()
        run: |
          set -euo pipefail
          [ -d "$NIGHT" ] || exit 0
          links=$(find "$NIGHT" -type l -print -delete)
          if [ -n "$links" ]; then echo "::error::symlinks in the night folder (removed before upload):"; echo "$links"; exit 1; fi
      - name: Guard-passed marker (research)
        run: |
          set -euo pipefail
          for snap in "$RUNNER_TEMP"/guard-*.snap; do
            [ -e "$snap" ] || continue
            [ -f "${snap%.snap}.ok" ] || { echo "::error::no passing workspace guard for $(basename "$snap")"; exit 1; }
          done
          date -u +%FT%TZ > "$NIGHT/guard-passed-research"
      - name: Upload night (research)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: night-research
          path: ${{ env.NIGHT }}/
          retention-days: 7
          if-no-files-found: ignore

  feel:
    needs: [plan, research]
    if: needs.research.outputs.halted != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NIGHT: ${{ needs.plan.outputs.night }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download night (research)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: night-research
          path: ${{ env.NIGHT }}
      - name: "Stage 2: preset mood"
        if: inputs.force_mood_preset != ''
        env:
          NIGHT_DATE: ${{ needs.plan.outputs.date }}
          PRESET: ${{ inputs.force_mood_preset }}
        run: node --import tsx harness/cli.ts feel --date "$NIGHT_DATE" --preset "$PRESET" --out "$NIGHT/mood.json" > /dev/null
      - name: "Render appraisal prompt"
        id: render
        if: inputs.force_mood_preset == ''
        run: node --import tsx harness/dry-run.ts step render-appraise --night "$NIGHT"
      - name: "Stage 2: appraise"
        id: appraise
        if: inputs.force_mood_preset == ''
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/agent
        with:
          stage: appraise
          model: haiku
          max_turns: '3'
          tools: Write
          prompt_file: ${{ steps.render.outputs.prompt_file }}
          allowed_write_paths: ${{ env.NIGHT }}/appraisals.json
          run_id: ${{ github.run_id }}-${{ github.run_attempt }}
          date: ${{ needs.plan.outputs.date }}
          attempt: '1'
          usage_file: ${{ env.NIGHT }}/usage/appraise.jsonl
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: "Guard after a cut-off call: Stage 2: appraise"
        if: always() && steps.appraise.outcome == 'failure'
        env:
          GUARD_FILE: ${{ runner.temp }}/guard-appraise-1.snap
          ALLOWED: ${{ env.NIGHT }}/appraisals.json
        run: bash "$RUNNER_TEMP/agent-guard.sh" check "$GUARD_FILE" "$ALLOWED"
      - name: "Stage 2: feel"
        if: inputs.force_mood_preset == ''
        env:
          NIGHT_DATE: ${{ needs.plan.outputs.date }}
        run: |
          set -euo pipefail
          node --import tsx harness/dry-run.ts step check-appraisals --night "$NIGHT"
          args=(feel --date "$NIGHT_DATE" --appraisals "$NIGHT/appraisals.json" --state-dir "$NIGHT/state" --out "$NIGHT/mood.json")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node --import tsx harness/cli.ts "${args[@]}" > /dev/null
          jq -c '{pad, dominant: [.dominant_emotions[].label]}' "$NIGHT/mood.json" || true
      - name: Reject symlinks (feel)
        if: always()
        run: |
          set -euo pipefail
          [ -d "$NIGHT" ] || exit 0
          links=$(find "$NIGHT" -type l -print -delete)
          if [ -n "$links" ]; then echo "::error::symlinks in the night folder (removed before upload):"; echo "$links"; exit 1; fi
      - name: Guard-passed marker (feel)
        run: |
          set -euo pipefail
          for snap in "$RUNNER_TEMP"/guard-*.snap; do
            [ -e "$snap" ] || continue
            [ -f "${snap%.snap}.ok" ] || { echo "::error::no passing workspace guard for $(basename "$snap")"; exit 1; }
          done
          date -u +%FT%TZ > "$NIGHT/guard-passed-feel"
      - name: Upload night (feel)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: night-feel
          path: ${{ env.NIGHT }}/
          retention-days: 7
          if-no-files-found: ignore

  brief:
    needs: [plan, feel]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NIGHT: ${{ needs.plan.outputs.night }}
    outputs:
      halted: ${{ steps.halt.outputs.halted }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download night (feel)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: night-feel
          path: ${{ env.NIGHT }}
      - name: "Render brief prompt (try 1)"
        id: render1
        run: node --import tsx harness/dry-run.ts step render-brief --night "$NIGHT" --try 1
      - name: "Stage 3: brief (try 1)"
        id: brief1
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/agent
        with:
          stage: brief
          model: haiku
          max_turns: '6'
          tools: Read,Write
          prompt_file: ${{ steps.render1.outputs.prompt_file }}
          allowed_write_paths: ${{ env.NIGHT }}/brief.json
          run_id: ${{ github.run_id }}-${{ github.run_attempt }}
          date: ${{ needs.plan.outputs.date }}
          attempt: '1'
          usage_file: ${{ env.NIGHT }}/usage/brief.jsonl
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: "Guard after a cut-off call: Stage 3: brief (try 1)"
        if: always() && steps.brief1.outcome == 'failure'
        env:
          GUARD_FILE: ${{ runner.temp }}/guard-brief-1.snap
          ALLOWED: ${{ env.NIGHT }}/brief.json
        run: bash "$RUNNER_TEMP/agent-guard.sh" check "$GUARD_FILE" "$ALLOWED"
      - name: "Stage 4: novelty gate A (try 1)"
        id: novelty1
        run: |
          if node --import tsx harness/cli.ts novelty --brief "$NIGHT/brief.json" --plan "$NIGHT/plan.json" --dossier "$NIGHT/dossier.json" > "$NIGHT/novelty-1.json"; then passed=true; else passed=false; fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          jq -c . "$NIGHT/novelty-1.json" || true
      - name: "Render brief prompt (try 2)"
        id: render2
        if: steps.novelty1.outputs.passed != 'true'
        run: node --import tsx harness/dry-run.ts step render-brief --night "$NIGHT" --try 2
      - name: "Stage 3: brief (try 2)"
        id: brief2
        if: steps.novelty1.outputs.passed != 'true'
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/agent
        with:
          stage: brief
          model: haiku
          max_turns: '6'
          tools: Read,Write
          prompt_file: ${{ steps.render2.outputs.prompt_file }}
          allowed_write_paths: ${{ env.NIGHT }}/brief.json
          run_id: ${{ github.run_id }}-${{ github.run_attempt }}
          date: ${{ needs.plan.outputs.date }}
          attempt: '2'
          usage_file: ${{ env.NIGHT }}/usage/brief.jsonl
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: "Guard after a cut-off call: Stage 3: brief (try 2)"
        if: always() && steps.brief2.outcome == 'failure'
        env:
          GUARD_FILE: ${{ runner.temp }}/guard-brief-2.snap
          ALLOWED: ${{ env.NIGHT }}/brief.json
        run: bash "$RUNNER_TEMP/agent-guard.sh" check "$GUARD_FILE" "$ALLOWED"
      - name: "Stage 4: novelty gate A (try 2)"
        id: novelty2
        if: steps.novelty1.outputs.passed != 'true'
        run: |
          if node --import tsx harness/cli.ts novelty --brief "$NIGHT/brief.json" --plan "$NIGHT/plan.json" --dossier "$NIGHT/dossier.json" > "$NIGHT/novelty-2.json"; then passed=true; else passed=false; fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          jq -c . "$NIGHT/novelty-2.json" || true
      - name: "Render brief prompt (try 3)"
        id: render3
        if: steps.novelty1.outputs.passed != 'true' && steps.novelty2.outputs.passed != 'true'
        run: node --import tsx harness/dry-run.ts step render-brief --night "$NIGHT" --try 3
      - name: "Stage 3: brief (try 3)"
        id: brief3
        if: steps.novelty1.outputs.passed != 'true' && steps.novelty2.outputs.passed != 'true'
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/agent
        with:
          stage: brief
          model: haiku
          max_turns: '6'
          tools: Read,Write
          prompt_file: ${{ steps.render3.outputs.prompt_file }}
          allowed_write_paths: ${{ env.NIGHT }}/brief.json
          run_id: ${{ github.run_id }}-${{ github.run_attempt }}
          date: ${{ needs.plan.outputs.date }}
          attempt: '3'
          usage_file: ${{ env.NIGHT }}/usage/brief.jsonl
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: "Guard after a cut-off call: Stage 3: brief (try 3)"
        if: always() && steps.brief3.outcome == 'failure'
        env:
          GUARD_FILE: ${{ runner.temp }}/guard-brief-3.snap
          ALLOWED: ${{ env.NIGHT }}/brief.json
        run: bash "$RUNNER_TEMP/agent-guard.sh" check "$GUARD_FILE" "$ALLOWED"
      - name: "Stage 4: novelty gate A (try 3)"
        id: novelty3
        if: steps.novelty1.outputs.passed != 'true' && steps.novelty2.outputs.passed != 'true'
        run: |
          if node --import tsx harness/cli.ts novelty --brief "$NIGHT/brief.json" --plan "$NIGHT/plan.json" --dossier "$NIGHT/dossier.json" > "$NIGHT/novelty-3.json"; then passed=true; else passed=false; fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          jq -c . "$NIGHT/novelty-3.json" || true
      - name: "Halt if three briefs failed"
        id: halt
        if: steps.novelty1.outputs.passed != 'true' && steps.novelty2.outputs.passed != 'true' && steps.novelty3.outputs.passed != 'true'
        run: node --import tsx harness/dry-run.ts step halt --night "$NIGHT" --stage brief --reason "three briefs failed Novelty Gate A"
      - name: Reject symlinks (brief)
        if: always()
        run: |
          set -euo pipefail
          [ -d "$NIGHT" ] || exit 0
          links=$(find "$NIGHT" -type l -print -delete)
          if [ -n "$links" ]; then echo "::error::symlinks in the night folder (removed before upload):"; echo "$links"; exit 1; fi
      - name: Guard-passed marker (brief)
        run: |
          set -euo pipefail
          for snap in "$RUNNER_TEMP"/guard-*.snap; do
            [ -e "$snap" ] || continue
            [ -f "${snap%.snap}.ok" ] || { echo "::error::no passing workspace guard for $(basename "$snap")"; exit 1; }
          done
          date -u +%FT%TZ > "$NIGHT/guard-passed-brief"
      - name: Upload night (brief)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: night-brief
          path: ${{ env.NIGHT }}/
          retention-days: 7
          if-no-files-found: ignore

  build_and_judge:
    needs: [plan, brief]
    if: needs.brief.outputs.halted != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NIGHT: ${{ needs.plan.outputs.night }}
      # Latest job second at which another attempt may start: its worst case (build 7 + gates 3 + 4 jury calls x 2
      # = 18 minutes) plus 1 minute for the upload must fit the 45-minute job timeout (SPEC Section 5; job timeouts
      # sum to 79 minutes worst-case). 1560 s = 26 minutes, and 26 + 19 = 45.
      LAST_ATTEMPT_START_S: '1560'
    steps:
      - name: Start the clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Download night (brief)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: night-brief
          path: ${{ env.NIGHT }}
      - name: "Render build prompt (attempt 1)"
        id: renderbuild1
        run: |
          set -euo pipefail
          rm -f "$NIGHT/piece/index.html"
          node --import tsx harness/dry-run.ts step render-build --night "$NIGHT" --attempt 1
      - name: "Stage 5: build (attempt 1)"
        id: build1
        timeout-minutes: 7
        continue-on-error: true
        uses: ./.github/actions/agent
        with:
          stage: build
          model: haiku
          max_turns: '30'
          tools: Read,Write,Edit,Bash(npm run gate:*)
          prompt_file: ${{ steps.renderbuild1.outputs.prompt_file }}
          allowed_write_paths: ${{ env.NIGHT }}/piece/index.html,${{ env.NIGHT }}/selfgate/
          run_id: ${{ github.run_id }}-${{ github.run_attempt }}
          date: ${{ needs.plan.outputs.date }}
          attempt: '1'
          usage_file: ${{ env.NIGHT }}/usage/build.jsonl
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: "Guard after a cut-off call: Stage 5: build (attempt 1)"
        if: always() && steps.build1.outcome == 'failure'
        env:
          GUARD_FILE: ${{ runner.temp }}/guard-build-1.snap
          ALLOWED: ${{ env.NIGHT }}/piece/index.html,${{ env.NIGHT }}/selfgate/
        run: bash "$RUNNER_TEMP/agent-guard.sh" check "$GUARD_FILE" "$ALLOWED"
      - name: "Stage 6: hard gates in a fresh folder (attempt 1)"
        id: gate1
        timeout-minutes: 3
        continue-on-error: true
        run: node --import tsx harness/dry-run.ts step gate --night "$NIGHT" --attempt 1
      - name: "Render jury prompts (attempt 1)"
        id: renderjury1
        if: steps.gate1.outputs.passed == 'true'
        run: node --import tsx harness/dry-run.ts step render-jury --night "$NIGHT" --attempt 1
      - name: "Stage 7: jury sample 1 (attempt 1)"
        id: jury1s1
        if: steps.gate1.outputs.passed == 'true'
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/agent
        with:
          stage: jury
          model: haiku
          effort: high
          max_turns: '4'
          tools: Read,Write
          prompt_file: ${{ steps.renderjury1.outputs.prompt_1 }}
          allowed_write_paths: ${{ env.NIGHT }}/attempt-1/verdict-sample-1.json
          run_id: ${{ github.run_id }}-${{ github.run_attempt }}
          date: ${{ needs.plan.outputs.date }}
          attempt: '1'
          usage_file: ${{ env.NIGHT }}/usage/jury.jsonl
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: "Guard after a cut-off call: Stage 7: jury sample 1 (attempt 1)"
