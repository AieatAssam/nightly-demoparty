        run: |
          set -euo pipefail
          for snap in "$RUNNER_TEMP"/guard-*.snap; do
            [ -e "$snap" ] || continue
            [ -f "${snap%.snap}.ok" ] || { echo "::error::no passing workspace guard for $(basename "$snap")"; exit 1; }
          done
          date -u +%FT%TZ > "$NIGHT/guard-passed-build_and_judge"
      - name: Upload night (build)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: night-build
          path: ${{ env.NIGHT }}/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [plan, research, feel, brief, build_and_judge]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    # deploy-pages alone may wait up to 10 minutes.
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NIGHT: ${{ needs.plan.outputs.night }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Each artifact holds the whole night so far. Only artifacts of jobs that succeeded (every guard passed) are
      # laid over the night folder, in order, and never one after a job that did not succeed.
      - name: Download night (plan)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: night-plan
          path: ${{ env.NIGHT }}
      - name: Download night (research)
        if: needs.research.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: night-research
          path: ${{ env.NIGHT }}
      - name: Download night (feel)
        if: needs.research.result == 'success' && needs.feel.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: night-feel
          path: ${{ env.NIGHT }}
      - name: Download night (brief)
        if: needs.research.result == 'success' && needs.feel.result == 'success' && needs.brief.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: night-brief
          path: ${{ env.NIGHT }}
      - name: Download night (build)
        if: needs.research.result == 'success' && needs.feel.result == 'success' && needs.brief.result == 'success' && needs.build_and_judge.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: night-build
          path: ${{ env.NIGHT }}
      - name: "Check the night's jobs"
        id: jobs
        env:
          RESEARCH: ${{ needs.research.result }}
          FEEL: ${{ needs.feel.result }}
          BRIEF: ${{ needs.brief.result }}
          BUILD: ${{ needs.build_and_judge.result }}
        run: |
          set -euo pipefail
          links=$(find "$NIGHT" -type l -print -delete)
          if [ -n "$links" ]; then echo "::error::symlinks in the downloaded night:"; echo "$links"; exit 1; fi
          failed=""
          why=""
          for pair in "research:$RESEARCH" "feel:$FEEL" "brief:$BRIEF" "build_and_judge:$BUILD"; do
            job=${pair%%:*}
            result=${pair#*:}
            case "$result" in
              success) if [ ! -f "$NIGHT/guard-passed-$job" ]; then failed=$job; why="its guard-passed marker is missing"; break; fi ;;
              skipped) ;;
              *) failed=$job; why="the job ended in $result"; break ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::warning::$failed: $why; shelving without its outputs"
            node --import tsx harness/dry-run.ts step halt --night "$NIGHT" --stage "$failed" --reason "$why; none of its outputs were used" > /dev/null
            echo "state_ok=false" >> "$GITHUB_OUTPUT"
          elif [ "$FEEL" = success ]; then
            echo "state_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "state_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "Stage 9: publish input"
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            node --import tsx harness/dry-run.ts step publish-input --night "$NIGHT" --dry-run
          else
            node --import tsx harness/dry-run.ts step publish-input --night "$NIGHT"
          fi
      - name: "Stage 9: publish (dry run)"
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          node --import tsx harness/cli.ts publish --input "$NIGHT/publish-input.json" --dry-run --out "$NIGHT/publish" > "$NIGHT/publish-output.json"
          fb="$NIGHT/feedback.json"
          args=(emotion-feedback --date "$(jq -r .date "$fb")" --status "$(jq -r .status "$fb")" --score "$(jq -r .score "$fb")"
            --compo "$(jq -r .compo "$fb")" --domain "$(jq -r .domain "$fb")" --dry-run --state-dir "$NIGHT/state")
          family=$(jq -r .technique_family "$fb")
          if [ -n "$family" ]; then args+=(--technique-family "$family"); fi
          node --import tsx harness/cli.ts "${args[@]}" > "$NIGHT/emotion-feedback.json"
          node --import tsx harness/dry-run.ts step finalize --night "$NIGHT" --dry-run
      - name: "Stage 9: publish"
        if: env.DRY_RUN != 'true'
        env:
          STATE_OK: ${{ steps.jobs.outputs.state_ok }}
        run: |
          set -euo pipefail
          node --import tsx harness/cli.ts publish --input "$NIGHT/publish-input.json" > "$NIGHT/publish-output.json"
          # The night's appraisals moved the scratch copy of the engine state. It becomes the real state only when feel
          # succeeded and no job failed; otherwise the shelved night's feedback lands on the unchanged state.
          if [ "$STATE_OK" = "true" ] && [ -f "$NIGHT/state/emotion.json" ]; then cp "$NIGHT/state/emotion.json" state/emotion.json; fi
          fb="$NIGHT/feedback.json"
          args=(emotion-feedback --date "$(jq -r .date "$fb")" --status "$(jq -r .status "$fb")" --score "$(jq -r .score "$fb")"
            --compo "$(jq -r .compo "$fb")" --domain "$(jq -r .domain "$fb")")
          family=$(jq -r .technique_family "$fb")
          if [ -n "$family" ]; then args+=(--technique-family "$family"); fi
          node --import tsx harness/cli.ts "${args[@]}" > "$NIGHT/emotion-feedback.json"
          node --import tsx harness/dry-run.ts step finalize --night "$NIGHT"
          cat "$NIGHT/usage.jsonl" >> audit/usage.jsonl
      - name: "Summary"
        run: jq . "$NIGHT/summary.json" || true
      - name: "Prune the audit folder"
        run: |
          set -euo pipefail
          rm -rf "$NIGHT/strips" "$NIGHT/selfgate" "$NIGHT/piece" "$NIGHT/state"
          find "$NIGHT" -name '*.png' -delete
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: night-audit
          path: ${{ env.NIGHT }}/
          retention-days: 30
          if-no-files-found: ignore
      # Git first, Pages second: the site can never show a night that is not on the branch.
      - name: "Commit and push the night"
        if: env.DRY_RUN != 'true'
        env:
          NIGHT_DATE: ${{ needs.plan.outputs.date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/emotion.json ledger/ledger.jsonl audit/
          if [ -d site/pieces ]; then git add site/pieces/; fi
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Night $NIGHT_DATE: $(jq -r .status "$NIGHT/summary.json")"
          for try in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort 2> /dev/null || true
            sleep $((try * 5))
          done
          echo "::error::push failed after 5 tries"
          exit 1
      - name: "Build site"
        if: env.DRY_RUN != 'true'
        run: if [ -f site/build.ts ]; then npm run site:build; fi
      - name: Configure Pages
        if: env.DRY_RUN != 'true' && hashFiles('site/dist/index.html') != ''
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: env.DRY_RUN != 'true' && hashFiles('site/dist/index.html') != ''
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b179fa # v3
        with:
          path: site/dist
      - name: Deploy Pages
        id: deployment
        if: env.DRY_RUN != 'true' && hashFiles('site/dist/index.html') != ''
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
