name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Check anchor gate files against the schema
        run: |
          set -euo pipefail
          count=0
          for f in anchors/anchor-*/gates.json; do
            node --import tsx harness/cli.ts validate gates "$f" > /dev/null || { echo "::error file=$f::gates.json does not match schemas/gates.schema.json"; exit 1; }
            count=$((count + 1))
          done
          [ "$count" -eq 12 ] || { echo "::error::expected 12 anchors, found $count"; exit 1; }
          echo "$count anchor gate files valid"

      - name: Build site
        run: if [ -f site/build.ts ]; then npm run site:build; fi

      # sloplint launches Chrome with its sandbox on; Ubuntu 24.04 AppArmor blocks the user namespaces it needs.
      - name: Audit site with Hallmark
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm run site:audit

      - name: Lint workflows
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
