name: Monthly Showcase

# No LLM: a script picks the month's top-scored published pieces from the ledger.
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: Month to showcase (YYYY-MM); empty means the previous month
        type: string
        default: ''
      dry_run:
        description: Build the page as an artifact only (no commit, no deploy)
        type: boolean
        default: false

permissions:
  contents: read

# Its own group: a monthly dispatch never displaces a pending nightly run (a group holds one pending run). The push
# rebases and retries, since nightly and weekly may push to the same branch at the same time.
concurrency:
  group: monthly
  cancel-in-progress: false

jobs:
  showcase:
    runs-on: ubuntu-latest
    # deploy-pages alone may wait up to 10 minutes.
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MONTH: ${{ inputs.month }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the showcase
        id: showcase
        run: |
          set -euo pipefail
          if [ -n "$MONTH" ]; then
            [[ "$MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]] || { echo "::error::month must be YYYY-MM"; exit 1; }
            node --import tsx harness/monthly-showcase.ts --month "$MONTH" | tee showcase.json
          else
            node --import tsx harness/monthly-showcase.ts | tee showcase.json
          fi
          echo "month=$(jq -r .month showcase.json)" >> "$GITHUB_OUTPUT"
          rm showcase.json

      - name: Rebuild the gallery
        run: if [ -f site/build.ts ]; then npm run site:build; fi

      - name: Upload the page
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monthly-${{ steps.showcase.outputs.month }}
          path: site/monthly/${{ steps.showcase.outputs.month }}/

      # Git first, Pages second: the site can never show a showcase that is not on the branch.
      - name: Commit and push the showcase
        if: env.DRY_RUN != 'true'
        env:
          SHOWCASE_MONTH: ${{ steps.showcase.outputs.month }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/monthly/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Monthly showcase $SHOWCASE_MONTH"
          for try in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort 2> /dev/null || true
            sleep $((try * 5))
          done
          echo "::error::push failed after 5 tries"
          exit 1
      - name: Configure Pages
        if: env.DRY_RUN != 'true' && hashFiles('site/dist/index.html') != ''
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: env.DRY_RUN != 'true' && hashFiles('site/dist/index.html') != ''
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b179fa # v3
        with:
          path: site/dist

      - name: Deploy Pages
        id: deployment
        if: env.DRY_RUN != 'true' && hashFiles('site/dist/index.html') != ''
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

