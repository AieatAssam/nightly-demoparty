<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Late Strobe</title>
<style>html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Calm drift for 6 s, then full-frame black/white flips at 6 Hz. Gate with timingScale 0.5 so the run reaches t = 6 s.
(() => {
  const ctx = document.getElementById('c').getContext('2d');
  const speed = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.12 : 1;

  const draw = (ms) => {
    const t = (ms / 1000) * speed;
    const g = ctx.createLinearGradient(0, 0, 1280, 720);
    g.addColorStop(0, `hsl(${200 + t * 6}, 45%, ${14 + 10 * Math.sin(t * 0.4)}%)`);
    g.addColorStop(1, `hsl(${250 + t * 6}, 50%, ${30 + 12 * Math.cos(t * 0.3)}%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1280, 720);
    ctx.fillStyle = 'hsla(40, 90%, 70%, 0.9)';
    ctx.beginPath();
    ctx.arc(640 + 420 * Math.sin(t * 0.7), 360 + 220 * Math.cos(t * 0.5), 140, 0, Math.PI * 2);
    ctx.fill();
    if (ms > 6000) {
      ctx.fillStyle = Math.floor(ms / 83.333) % 2 ? '#ffffff' : '#000000';
      ctx.fillRect(0, 0, 1280, 720);
    }
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
